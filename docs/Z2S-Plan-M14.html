/* ---------- shared scene furniture ----------
   The pieces every model in the set is built from, so fourteen scenes read as
   one world photographed fourteen times rather than fourteen drawings. */

/* A plinth: a stepped clay disc with its own rim and lip. Almost every model in
   the set stands on one. */
function clayPlinth(cx,cy,rx,u,o){
  o=o||{};
  return clayCyl(cx,cy,rx,o.h||16,o.m||CLAY.sn,u,{taper:0.99})
    +clayCyl(cx,cy-(o.h||16),rx*0.94,5,o.m||CLAY.sn,u,{taper:0.995});
}
/* A terraced platform: the rectangular cousin of the plinth. */
function clayDeck(x,base,w,h,d,u,m){
  m=m||CLAY.sn;
  return claySlab(x,base,w,h,d,m,u,{r:7})
    +claySlab(x+5,base-h,w-10,4,d-8,m,u,{r:3});
}
/* A gatehouse: two jambs and a lintel with a lamp over the opening. Nothing in
   this world passes a gate without going through the hole in it. */
function clayArch(cx,base,w,h,d,u,o){
  o=o||{}; var m=o.m||CLAY.st, jw=w*0.26, op=w-jw*2, g="";
  g+=claySlab(cx-w/2,base,jw,h,d,m,u,{r:jw*0.34});
  g+=claySlab(cx+w/2-jw,base,jw,h,d,m,u,{r:jw*0.34});
  g+=claySlab(cx-w/2-3,base-h+w*0.3,w+6,w*0.3,d+4,m,u,{r:8});
  g+='<path d="M '+n1(cx-op/2)+' '+n1(base)+' L '+n1(cx-op/2)+' '+n1(base-h+w*0.3)
    +' L '+n1(cx+op/2)+' '+n1(base-h+w*0.3)+' L '+n1(cx+op/2)+' '+n1(base)
    +'" fill="'+dark(m.e,.25)+'" opacity=".5"/>';
  return g;
}
/* A hopper standing on legs: how loose material arrives anywhere in this world. */
function clayHopper(cx,base,r,u,m){
  m=m||CLAY.sn;
  return clayCyl(cx-r*0.5,base,r*0.13,r*0.7,m,u)+clayCyl(cx+r*0.5,base,r*0.13,r*0.7,m,u)
    +clayCone(cx,base-r*0.62,r,r*0.24,r*0.72,m,u)
    +clayCyl(cx,base-r*0.62-r*0.72,r*0.98,r*0.34,m,u,{open:1});
}
/* A drum housing with a window: the default machine in the set. */
function clayHouse(cx,base,r,h,u,o){
  o=o||{}; var m=o.m||CLAY.st;
  return clayCyl(cx,base,r,h,m,u)
    +(o.cap===false?"":clayDome(cx,base-h,r*0.98,r*0.62,o.capM||CLAY.sn,u));
}
/* A stack of clay tiles — a document, a report, a set of criteria. */
function clayTiles(x,base,w,n,u,m,thick){
  m=m||CLAY.sn; var g="",t=thick||5;
  for(var i=0;i<n;i++) g+=claySlab(x+(i%2?1:0),base-i*t,w,t,w*0.5,m,u,{r:2.4});
  return g;
}
/* A rolled scroll, tied. The one thing in this set that is never allowed through. */
function clayScroll(cx,cy,len,r,u,m){
  m=m||CLAY.tc;
  return '<path d="'+rp([[cx-len/2,cy-r],[cx+len/2,cy-r],[cx+len/2,cy+r],[cx-len/2,cy+r]],r)
      +'" fill="url(#'+m.id+'c'+u+')"/>'
    +'<path d="M '+n1(cx-len/2+r*0.6)+' '+n1(cy-r*0.5)+' L '+n1(cx+len/2-r*0.6)+' '+n1(cy-r*0.5)
      +'" stroke="'+lite(m.hi,.4)+'" stroke-opacity=".5" stroke-width="'+n1(r*0.4)+'" stroke-linecap="round"/>'
    +'<path d="M '+n1(cx)+' '+n1(cy-r*1.15)+' L '+n1(cx)+' '+n1(cy+r*1.15)+'" stroke="'+CLAY.st.f
      +'" stroke-width="'+n1(r*0.34)+'" stroke-linecap="round"/>';
}
/* A tally post: beads on a rod, the last of them terracotta because it is the
   one that stops the run. */
function clayTally(x,base,n,used,u){
  var g=clayCyl(x,base,3,14+n*11,CLAY.sn,u),i;
  for(i=0;i<n;i++){
    var m=(i===n-1)?CLAY.tc:CLAY.st;
    g+='<ellipse cx="'+n1(x)+'" cy="'+n1(base-16-i*11)+'" rx="7.5" ry="6.4" fill="url(#'+m.id+'d'+u+')"/>';
    g+='<ellipse cx="'+n1(x-2)+'" cy="'+n1(base-18-i*11)+'" rx="2.6" ry="2" fill="'+lite(m.hi,.5)+'" opacity=".55"/>';

/* A wave of clay standing for liquid in a basin: a slab with a rounded lip and a
   cool sheen, never a flat fill. */
function clayWater(cx,cy,rx,u,o){
  o=o||{}; var ry=rx*K;
  return '<g class="'+(o.still?"":"br")+'" style="--d:'+(o.d||5)+'s;--o:'+(o.o||0)+'s">'
    +'<path d="'+ell(cx,cy,rx,ry)+'" fill="'+GLOW.deep+'" opacity=".26"/>'
    +'<path d="'+ell(cx,cy,rx*0.94,ry*0.9)+'" fill="'+GLOW.body+'" opacity=".5"/>'
    +'<path d="'+ell(cx-rx*0.2,cy-ry*0.2,rx*0.4,ry*0.34)+'" fill="'+GLOW.core+'" opacity=".55"/></g>';

/* ---------- the fallback model: the workshop bench ----------
   A sequence this set has not been given its own model for is built here: one
   long stone bench, one module per step shaped by what that step does, a tube
   threading them, and the accent travelling it. It handles branches, unfired
   steps and a return rail, so no data shape can leave the page without a
   picture. */
function clayStation(cx,base,kind,h,u,i,ghost){
  var m=ghost?CLAY.gh:(kind==="accent"?CLAY.tc:CLAY.st), g="", lit="";
  if(kind==="input"){
    g=clayHopper(cx,base,26,u,ghost?CLAY.gh:CLAY.sn);
  } else if(kind==="gate"){
    g=clayArch(cx,base,64,h,26,u,{m:m});
    if(!ghost) lit=clayGlow(cx,base-h+10,4,u,WARM,{d:3.6,o:i*0.4});
  } else if(kind==="accent"){
    g=clayCyl(cx,base,25,h,m,u)+clayDome(cx,base-h,25,17,m,u);
    if(!ghost) lit=clayLit(cx-8,base-h*0.62,16,20,u,WARM,{d:4.1,o:i*0.33})
      +clayGlow(cx,base-h-13,5,u,WARM,{d:3.2,o:i*0.5});
  } else {
    g=clayHouse(cx,base,25,h,u,{m:m,capM:ghost?CLAY.gh:CLAY.sn});
    if(!ghost) lit=clayLit(cx-16,base-h*0.55,13,16,u,GLOW,{d:3.4,o:i*0.29})
      +clayLit(cx+3,base-h*0.55,13,16,u,GLOW,{d:4.2,o:i*0.51});
  }
  return {body:g,lit:lit};
}
function clayBench(f,title){
  var u=++ART_SEQ, steps=f.steps||[], n=steps.length||1;
  var W=1080, padX=56, base=430, colW=(W-padX*2)/n, x0=padX+colW/2;
  var maxChars=Math.max(10,Math.round(colW/7.4));
  var labels=steps.map(function(st){
    if(st.branch) return st.branch.reduce(function(a,b){
      var L=artWrap(b.title,maxChars-2); L[0]="· "+L[0]; return a.concat(L);},[]);
    return artWrap(st.title,maxChars);
  });
  var maxLab=labels.reduce(function(a,l){return Math.max(a,l.length);},1);
  var H=Math.round(base+62+maxLab*19+26);
  var arm=f.arm, yArm=0;
  if(arm){ yArm=base+62+maxLab*19+34; H=Math.round(yArm+52); }

  var lastRun=steps.reduce(function(a,st,i){return st.ghost?a:i;},0);
  var sh="",body="",lit="",fx="",labs="",cues="";
  /* the bench itself, and the rail the sequence is threaded onto */
  sh+=clayShadow(W/2,base+4,W*0.44,u,0.55);
  body+='<g class="obj" style="--i:0">'+clayDeck(padX-6,base,W-padX*2+12,15,30,u)+'</g>';
  var railY=base-16, rx0=x0-colW*0.42, rx1=x0+lastRun*colW+colW*0.42;
  var railD="M "+n1(rx0)+" "+n1(railY)+" L "+n1(rx1)+" "+n1(railY);
  body+='<g class="obj" style="--i:1">'+clayTube(railD,11,CLAY.sn)+'</g>';
  fx+=clayFlow(railD,6,74,3.4,0);

  steps.forEach(function(st,i){
    var cx=x0+i*colW, ghost=!!st.ghost, kind=st.kind||"";
    var h=st.h||(kind==="accent"?104:kind==="gate"?96:kind==="input"?70:84);
    if(!ghost) sh+='<g class="sh" style="--i:'+i+'">'+clayShadow(cx,base-14,34,u,0.8)+'</g>';
    if(st.branch){
      var bn=st.branch.length, bw=Math.min(30,(colW-18)/bn);
      var sx=cx-(bn*bw+(bn-1)*6)/2+bw/2, g="";
      for(var k=0;k<bn;k++){
        var bx=sx+k*(bw+6);
        g+=clayCyl(bx,base-14,bw*0.42,52+((k%2)*10),CLAY.st,u)
          +clayDome(bx,base-66-((k%2)*10),bw*0.4,bw*0.26,CLAY.sn,u);
        lit+=clayLit(bx-4,base-46-((k%2)*10),9,11,u,GLOW,{d:3.3+k*0.4,o:k*0.37});
      }
      /* the cradle: these pieces are in the fixture at the same time */
      g+=claySlab(cx-(bn*bw+(bn-1)*6)/2-7,base-14,bn*bw+(bn-1)*6+14,7,22,CLAY.sn,u,{r:3});
      body+='<g class="obj"'+(ghost?' opacity=".45"':"")+' style="--i:'+(i+2)+'">'+g+'</g>';
    } else {
      var st2=clayStation(cx,base-14,kind,h,u,i,ghost);
      body+='<g class="obj"'+(ghost?' opacity=".5"':"")+' style="--i:'+(i+2)+'">'+st2.body+'</g>';
      lit+=st2.lit;
    }
    if(i===0) fx+=clayWorker(cx-40,base+2,30,u,{pose:"push",o:0.2});
    if(kind==="gate"&&!ghost) fx+=clayWorker(cx+42,base+2,30,u,{pose:"watch",o:i*0.4,flip:true});
    labs+=clayTag(cx,base+30,i,i+1);
    labs+=clayCaption(cx,base+62,labels[i],i);
  });

  if(arm){
    var fi=arm.from|0, ti=arm.to|0;
    var fx0=x0+fi*colW+30, tx=x0+ti*colW-30;
    var trough="M "+n1(fx0)+" "+n1(base+10)+" C "+n1(fx0+30)+" "+n1(yArm)+" "+n1(tx-30)+" "+n1(yArm)
      +" "+n1(tx)+" "+n1(base+10);
    body+='<g class="obj" style="--i:'+(n+2)+'">'+clayTube(trough,13,CLAY.sn)+'</g>';
    fx+=clayFlow(trough,7,64,3.2,0.6,WARM);
    body+='<g class="obj" style="--i:'+(n+3)+'">'+clayTally(tx-26,base+6,3,1,u)+'</g>';
    var mid=(fx0+tx)/2;
    labs+='<g class="lab" style="--i:'+n+'">'
      +'<text x="'+n1(mid)+'" y="'+n1(yArm-4)+'" text-anchor="middle" font-size="13" font-weight="500" fill="'
        +ART_BLUE+'">'+esc(arm.label||"")+'</text>'
      +'<text x="'+n1(mid)+'" y="'+n1(yArm+16)+'" text-anchor="middle" font-size="12" fill="'+ART_BLUE
        +'" opacity=".74">'+esc(arm.bound||"")+'</text>'
      +'<text x="'+n1(tx-40)+'" y="'+n1(base-4)+'" text-anchor="end" font-size="12" font-weight="600" fill="'
        +ART_BLUE+'" opacity=".8">'+esc(arm.tick||"")+'</text></g>';
  }
  return clayFrame({u:u,w:W,h:H,title:title,deck:f.caption||"",
    alt:"A clay model of "+(title||"a sequence")+": "+n+" modules standing along one stone bench, "
      +"the accent travelling the rail that threads them.",
    far:clayFar(W,base-10,u,n+3), shadow:sh, body:body, lit:lit, fx:fx,
    note:labs+cues});
}

/* ---------- the fallback wall ----------
   The one picture no sequence can draw: a barrier, things on both sides of it,
   and one thing refused at it. */
function clayWall(sc,title){
  var u=++ART_SEQ, W=1080, H=560, base=436;
  var pass=sc.passes||[], np=pass.length;
  var sh="",body="",lit="",fx="",labs="";
  sh+=clayShadow(W/2,base+6,W*0.4,u,0.5);
  body+='<g class="obj" style="--i:0">'+clayDeck(120,base,840,14,28,u)+'</g>';
  var wx=560;
  body+='<g class="obj" style="--i:1">'+claySlab(wx-26,base-14,52,180,40,CLAY.st,u,{r:14})+'</g>';
  for(var i=0;i<np;i++){
    var y=base-46-i*44;
    body+='<g class="obj" style="--i:'+(i+2)+'">'+clayTiles(300+i*36,y,44,3,u,CLAY.sn)+'</g>';
    labs+=clayTag(322+i*36,y+16,i,i+1);
  }
  body+='<g class="obj" style="--i:'+(np+2)+'">'+clayScroll(300,base-30,60,11,u)+'</g>';
  labs+=clayTag(300,base-8,np,np+1);
  body+='<g class="obj" style="--i:'+(np+3)+'">'+clayHouse(760,base-14,44,120,u)+'</g>';
  lit+=clayLit(742,base-100,20,24,u,WARM,{d:3.8});
  labs+=clayTag(760,base+16,np+1,np+2);
  labs+=clayTag(wx,base+16,np+2,np+3);
  return clayFrame({u:u,w:W,h:H,title:title,deck:sc.caption||"",
    alt:"A clay model of a wall with slots: three things pass through it and one is refused at it.",
    far:clayFar(W,base-8,u,5), shadow:sh, body:body, lit:lit, fx:fx, note:labs});

/* ---------- 14 · The Harbour Locks ----------
   Waves as a flight of lock chambers. Water reaches a chamber only when the one
   above it is full and its gate opens, which is the whole rule stated as
   plumbing: every barge moored in a chamber floats at the same moment, and
   nothing in a chamber moves before the chamber above it has finished. The barges
   are the milestones, stamped with their own identifiers. */
function clayChamber(x,y,w,h,d,u,m,i){
  m=m||CLAY.sn;
  var dx=d*0.58, dy=d*0.3, t=Math.min(7,w*0.13);
  var open=P([[x+t,y-t*0.4],[x+w-t,y-t*0.4],[x+w+dx-t,y-dy+t*0.4],[x+dx+t,y-dy+t*0.4]]);
  return {body:claySlab(x,y+h,w,h,d,m,u,{r:5})
      +'<path d="'+open+'" fill="'+dark(m.s,.45)+'"/>'
      +'<path d="'+open+'" fill="url(#in'+u+')"/>',
    open:open};
}
function clayLocks(waves,title,intro){
  var u=++ART_SEQ, W=1080, padX=58, n=(waves||[]).length||1;
  var bw=(W-padX*2)/n, topY=256, drop=15, ch=64, d=52;
  var H=Math.round(topY+n*drop+ch+126);
  var sh="",body="",lit="",fx="",labs="";
  var lastY=topY+(n-1)*drop;
  sh+=clayShadow(W/2,lastY+ch+16,W*0.44,u,0.5);
  /* the retaining wall the flight is cut into: a stepped bank, not a hillside */
  var bank="";
  for(var q=0;q<n;q++) bank+=claySlab(padX+q*bw-4,topY+q*drop+ch+18,bw+8,28,d*0.5,CLAY.sn,u,{r:4});
  body+='<g class="obj" style="--i:0">'+bank+'</g>';

  (waves||[]).forEach(function(w,i){
    var x=padX+i*bw, y=topY+i*drop, last=(i===n-1);
    var c=clayChamber(x,y,bw-5,ch,d,u,CLAY.sn,i);
    body+='<g class="obj" style="--i:'+(i+1)+'">'+c.body+'</g>';
    /* the water standing in the chamber, shimmering a beat after the one above */
    lit+='<g class="amb" style="--i:'+(i+1)+'">'
      +'<path class="br" style="--d:5.4s;--o:'+n1(i*0.3)+'s" d="'+c.open+'" fill="'+GLOW.body
      +'" opacity=".34" transform="translate(0,3)"/>'
      +'<path d="'+c.open+'" fill="none" stroke="'+GLOW.core+'" stroke-opacity=".6" '
      +'stroke-width="1.5" transform="translate(0,3)"/></g>';
    /* the gate at the foot of the chamber, with its wheel, and the spill through it */
    if(!last){
      var gx=x+bw-8;
      body+='<g class="obj" style="--i:'+(i+1)+'">'+claySlab(gx-4,y+ch+2,9,ch*0.6,d*0.42,CLAY.st,u,{r:2.6})
        +'<circle cx="'+n1(gx+0.5)+'" cy="'+n1(y+ch-36)+'" r="5.4" fill="url(#std'+u+')"/></g>';
      fx+=clayFlow("M "+n1(gx+4)+" "+n1(y+6)+" L "+n1(gx+13)+" "+n1(y+drop+2),4,24,2,n1(i*0.2));
    }
    /* the barges moored in it: one per milestone, all afloat at the same moment */
    /* the barges, moored INSIDE the chamber and afloat together. At this scale a
       hull cannot carry a legible name, so the identifier is stamped on a stone
       plate set into the chamber's own front wall instead. */
    var cnt=w.length||1, dxs=d*0.58, dys=d*0.3;
    var hw=Math.min(26,(bw-26)/cnt-4);
    var sx=x+10+(bw-25-(cnt*hw+(cnt-1)*5))/2;
    w.forEach(function(id,j){
      var back=(cnt>1&&j===1), bx=sx+j*(hw+5)+(back?dxs*0.5:0), by=y-2-(back?dys*0.55:0);
      body+='<g class="obj" style="--i:'+(i+1)+'"><g class="hov" style="--d:'
        +(4.6+j*0.7+i*0.11)+'s;--o:'+n1(i*0.18)+'s">'
        +'<path d="'+rp([[bx,by],[bx+hw,by],[bx+hw-3,by-8],[bx+3,by-8]],2.6)+'" fill="url(#'
          +(last?"tc":"st")+'c'+u+')"/>'
        +'<path d="M '+n1(bx+3)+' '+n1(by-8)+' L '+n1(bx+hw-3)+' '+n1(by-8)+'" stroke="'
          +lite(last?CLAY.tc.hi:CLAY.st.hi,.45)+'" stroke-opacity=".65" stroke-width="1.3" '
          +'stroke-linecap="round"/>'
        +'<path d="M '+n1(bx+hw*0.5)+' '+n1(by-8)+' L '+n1(bx+hw*0.5)+' '+n1(by-19)
          +'" stroke="'+CLAY.sn.f+'" stroke-width="1.8" stroke-linecap="round"/></g></g>';
      /* the plate, set into the front wall under the boat it names */
      var pw=Math.min(30,(bw-16)/cnt-4), px=x+8+(bw-21-(cnt*pw+(cnt-1)*4))/2+j*(pw+4);
      body+='<g class="obj" style="--i:'+(i+1)+'">'
        +claySlab(px,y+30,pw,13,4,CLAY.st,u,{r:3})
        +'<text x="'+n1(px+pw/2)+'" y="'+n1(y+26.5)+'" text-anchor="middle" font-size="9.5" '
        +'font-weight="700" fill="#E4EAF4">'+esc(id)+'</text></g>';
    });
    labs+=clayTag(x+(bw-5)/2,y+ch+34,i,i+1);
  });
  /* the header the water comes in from, and the keeper who opens the first gate */
  body+='<g class="obj" style="--i:0">'+clayCyl(padX-26,topY+ch*0.55,17,50,CLAY.st,u)
    +clayDome(padX-26,topY+ch*0.55-50,17,12,CLAY.sn,u)+'</g>';
  lit+='<g class="amb" style="--i:0">'+clayGlow(padX-26,topY+ch*0.55-69,5,u,WARM,{d:3.4})+'</g>';
  fx+=clayFlow("M "+n1(padX-12)+" "+n1(topY+ch*0.55-36)+" L "+n1(padX+bw*0.42)+" "+n1(topY+3),
    5,28,2.1,0);
  fx+=clayWorker(padX-4,topY+ch*0.6+34,29,u,{pose:"turn",o:.3});
  fx+=clayWorker(W-padX+16,lastY+ch+18,29,u,{pose:"watch",o:1.1,flip:true});
  labs+='<g class="lab" style="--i:'+n+'"><text x="'+n1(padX-38)+'" y="'+n1(topY+ch+62)
    +'" font-size="13" fill="#67645C">Wave</text></g>';
  labs+=clayCue("M "+n1(padX+bw*1.5)+" "+n1(topY+drop-22)+" V 206 h 24",
    n1(topY+drop-22-206+24),"A chamber fills only once the one above it has",
    n1(padX+bw*1.5+30),210.5,1,"start",[padX+bw*1.5,topY+drop-22]);
  return clayFrame({u:u,w:W,h:H,title:title,deck:intro||"",
    alt:"A clay model of a flight of "+n+" lock chambers stepping down a stone bank. Each chamber "
      +"holds the milestone barges that may run together, floating on cool water, and fills only "
      +"after the chamber above it through a gate at its foot.",
    far:clayHaze(140,W-140,topY-30,u,7,0.45), shadow:sh, body:body, lit:lit, fx:fx,
    near:clayNear(W,H,u), note:labs});
}
/* A stone quay: the ground almost every row scene stands on. Thick enough to
   read as masonry, with its own lip, and a contact shadow of its own. */
function clayQuay(x,base,w,u,o){
  o=o||{}; var h=o.h||24, d=o.d||40;
  return claySlab(x,base,w,h,d,CLAY.sn,u,{r:7})
    +claySlab(x+6,base-h,w-12,5,d-10,CLAY.sn,u,{r:2.6});
}
/* An overhead pipe on short posts. The derived part of a chain runs along one of
   these, above the machines, where nobody has to touch it. */
function clayPipeRun(x0,x1,y,deck,u,posts){
  var g="",i;
  for(i=0;i<posts.length;i++) g+=clayCyl(posts[i],deck,4.8,deck-y,CLAY.sn,u);
  var d="M "+n1(x0)+" "+n1(y)+" L "+n1(x1)+" "+n1(y);
  return {body:g+clayTube(d,13,CLAY.sn), fx:clayFlow(d,7,84,3.4,0)};
}

/* ============ 01 · The Foundry Yard ============
   Where the effort goes. The left end of the yard is hand-worked and crowded —
   material tipped in by hand, and a lit table where every open question is put to
   the people who can answer it. Past that table the yard runs itself: a rack, a
   calculating drum, a sieve and a kiln, joined by one overhead pipe, and not one
   figure standing at any of them. The population count IS the argument. */
CLAY_SCENE["Where the effort goes"]=function(f,title){
  var u=++ART_SEQ;
  return clayRow(u,f,title,408,function(c){
    var sh="",body="",lit="",fx="",labs="",top=c.base-24, S=104;
    sh+=clayShadow(c.W/2,c.base+8,c.W*0.43,u,0.52);
    body+='<g class="obj" style="--i:0">'+clayQuay(c.padX-16,c.base,c.W-c.padX*2+32,u)+'</g>';
    /* the overhead run, behind the machines, on posts standing in the gaps */
    var gaps=[]; for(var q=1;q<5;q++) gaps.push(c.cx(q)+c.colW*0.5);
    var run=clayPipeRun(c.cx(1)+S*0.34,c.cx(5)-S*0.4,top-S*1.52,top,u,gaps);
    body+='<g class="obj" style="--i:1">'+run.body+'</g>'; fx+=run.fx;
    var mods=[
      modHopper(c.cx(0),top,S,u,{o:0}),
      modDesk(c.cx(1),top,S,u,{o:.3}),
      modStack(c.cx(2),top,S,u,{o:.5,rows:4}),
      modDrum(c.cx(3),top,S,u,{o:.8,gd:10}),
      modSieve(c.cx(4),top,S,u,{o:1.1}),
      modKiln(c.cx(5),top,S,u,{o:1.4})
    ];
    mods.forEach(function(m,i){
      sh+='<g class="sh" style="--i:'+i+'">'+clayShadow(c.cx(i),top,S*0.42,u,0.85)+'</g>';
      body+='<g class="obj" style="--i:'+(i+1)+'">'+m.body+'</g>';
      lit+='<g class="amb" style="--i:'+i+'">'+m.lit+'</g>';
      fx+=m.fx;
    });
    /* the overhead run: everything downstream of the table is joined by it */

    /* the crowd, and only here */
    [[-72,"lift",0,false],[-46,"push",.35,false],[38,"carry",.7,true],[62,"walk",1.1,true]]
      .forEach(function(p){fx+=clayWorker(c.cx(0)+p[0],top+2,30,u,{pose:p[1],o:p[2],flip:p[3]});});
    [[-56,"point",.15,false],[-30,"type",.55,false],[30,"watch",.95,true],[54,"hold",1.35,true]]
      .forEach(function(p){fx+=clayWorker(c.cx(1)+p[0],top+2,31,u,{pose:p[1],o:p[2],flip:p[3]});});
    labs+=clayCue("M "+n1(c.cx(0)+S*0.46)+" "+n1(top-S*0.62)+" V 192 h 20",
      n1(top-S*0.62-192+20),"Eight people, one hour, once",n1(c.cx(0)+S*0.46+26),196.5,0,"start",
      [c.cx(0)+S*0.46,top-S*0.62]);
    labs+=clayCue("M "+n1(c.cx(4)+S*0.5)+" "+n1(top-S*0.86)+" V 220 H "+n1(c.W-92),
      n1(top-S*0.86-220+Math.abs(c.W-92-c.cx(4)-S*0.5)),"Nobody is standing at any of these",
      n1(c.W-84),224.5,3,"start",[c.cx(4)+S*0.5,top-S*0.86]);
    return {sh:sh,body:body,lit:lit,fx:fx,labs:labs,
      far:clayHaze(150,c.W-140,c.base-40,u,4,0.6), near:clayNear(c.W,c.base+150,u),
      alt:"A clay model of a foundry yard. At the left, figures tip material into a hopper and gather "
        +"round a lit decision table; to the right an overhead pipe carries the work through a rack, a "
        +"geared drum, a rocking sieve and a lit kiln, with nobody standing at any of them."};
  });
};

/* ============ 02 · The Narrowing Aqueduct ============
   The specification chain as water crossing a run of basins on stone piers. Each
   basin is set lower and cut narrower than the one before it, so the same water
   arrives somewhere more particular without anything being added to it. Near the
   end the channel forks into two basins filled side by side, and both of them
   empty into the terracotta catch basin that the plan is drawn from. */
CLAY_SCENE["The specification chain"]=function(f,title){
  var u=++ART_SEQ;
  return clayRow(u,f,title,424,function(c){
    var sh="",body="",lit="",fx="",labs="";
    var n=c.n, rr=[], yy=[];
    for(var i=0;i<n;i++){ rr.push(50-i*3.8); yy.push(c.base-166+i*21); }
    sh+=clayShadow(c.W/2,c.base+8,c.W*0.42,u,0.5);
    body+='<g class="obj" style="--i:0">'+clayQuay(c.padX-16,c.base,c.W-c.padX*2+32,u,{h:20})+'</g>';
    var deck=c.base-20;
    /* a basin of water: a cool sheen with a bright meniscus, never a flat fill */
    function water(x,y,r,warmRim,i){
      return '<g class="amb" style="--i:'+i+'">'
        +'<path class="br" style="--d:'+(4.6+i*0.3)+'s;--o:'+n1(i*0.28)+'s" d="'
        +ell(x,y,r*0.86,r*0.86*K)+'" fill="'+GLOW.body+'" opacity=".3"/>'
        +'<path d="'+ell(x,y,r*0.86,r*0.86*K)+'" fill="none" stroke="'+GLOW.core
        +'" stroke-opacity=".7" stroke-width="1.9"/>'
        +(warmRim?clayGlow(x-r*0.7,y-6,4.6,u,WARM,{d:3.2}):"")+'</g>';
    }
    /* a spout: out over the lip, then straight down into what is below it */
    function spout(x0,y0,x1,y1,i){
      var mid=y1-30;
      return clayFlow("M "+n1(x0)+" "+n1(y0)+" L "+n1(x0+16)+" "+n1(y0+3)
        +" Q "+n1(x1)+" "+n1(y0+6)+" "+n1(x1)+" "+n1(mid)+" L "+n1(x1)+" "+n1(y1),
        6,34,2.1,n1(i*0.3));
    }
    c.steps.forEach(function(st,i){
      var x=c.cx(i), r=rr[i], y=yy[i], last=(i===n-1), br=st.branch;
      var m=last?CLAY.tc:CLAY.st;
      sh+='<g class="sh" style="--i:'+i+'">'+clayShadow(x,deck,r*0.8,u,0.8)+'</g>';
      if(br){
        var bn=br.length, brr=r*0.6;
        body+='<g class="obj" style="--i:'+(i+1)+'">'+clayCyl(x,deck,r*0.42,deck-y-16,CLAY.sn,u)
          +claySlab(x-r*1.2,y+4,r*2.4,13,26,CLAY.sn,u,{r:5})+'</g>';
        br.forEach(function(b,k){
          var bx=x+(k-(bn-1)/2)*r*1.24;
          body+='<g class="obj" style="--i:'+(i+1)+'">'+clayCyl(bx,y,brr,27,CLAY.st,u,{open:1})+'</g>';
          lit+=water(bx,y-24,brr,false,i);
          labs+=clayTag(bx,y-brr*K-30,i,(i+1)+String.fromCharCode(97+k));
          fx+=spout(bx+brr*0.9,y-16,c.cx(i+1)-rr[i+1]*0.5+k*10,yy[i+1]-24,k);
        });
      } else {
        body+='<g class="obj" style="--i:'+(i+1)+'">'
          +clayCyl(x,deck,r*0.46,deck-y,CLAY.sn,u)
          +clayCyl(x,y,r,29,m,u,{open:1})+'</g>';
        lit+=water(x,y-26,r,last,i);
        if(i<n-1){
          var nx=c.cx(i+1), ny=yy[i+1], nb=(c.steps[i+1]||{}).branch;
          fx+=spout(x+r*0.9,y-18,nb?nx:(nx-rr[i+1]*0.5),(nb?ny-40:ny-26),i);
        }
      }
    });
    /* the head of the run: a stone header tank with the sluice under it */
    body+='<g class="obj" style="--i:0">'+clayCyl(c.padX+8,deck,17,84,CLAY.sn,u)
      +clayCyl(c.padX+8,deck-84,15,9,CLAY.st,u)+clayDome(c.padX+8,deck-93,15,11,CLAY.sn,u)+'</g>';
    lit+='<g class="amb" style="--i:0">'+clayGlow(c.padX+8,deck-108,5,u,WARM,{d:3.8})+'</g>';
    fx+=spout(c.padX+24,deck-76,c.cx(0)-rr[0]*0.5,yy[0]-26,0);
    fx+=clayWorker(c.padX+48,deck+2,30,u,{pose:"turn",o:.2});
    fx+=clayWorker(c.cx(2)-46,deck+2,29,u,{pose:"watch",o:1.2});
    labs+=clayCue("M "+n1(c.cx(3))+" "+n1(yy[3]-rr[3]*K-40)+" V 206 h -26",
      n1(yy[3]-rr[3]*K-40-206+26),"Each basin is cut narrower than the last",n1(c.cx(3)-32),210.5,3,
      "end",[c.cx(3),yy[3]-rr[3]*K-40]);
    return {sh:sh,body:body,lit:lit,fx:fx,labs:labs,
      far:clayHaze(150,c.W-150,c.base-38,u,9,0.5), near:clayNear(c.W,c.base+150,u),
      alt:"A clay model of a run of stone piers carrying basins that step down and narrow from left to "
        +"right, water spouting from each into the next, forking into two basins near the end that both "
        +"empty into a terracotta catch basin."};
  });
};

/* ============ 03 · The Long Workshop ============
   The whole method as one bench. A gatehouse stands at the second station, where
   every open question is answered once, and everything to the right of it is
   machinery joined by a single overhead pipe. A second gate near the end is a
   sieve rather than a doorway, because a coverage check is not a conversation. */
CLAY_SCENE["The whole method"]=function(f,title){
  var u=++ART_SEQ;
  return clayRow(u,f,title,412,function(c){
    var sh="",body="",lit="",fx="",labs="",top=c.base-24,S=98;
    sh+=clayShadow(c.W/2,c.base+8,c.W*0.44,u,0.52);
    body+='<g class="obj" style="--i:0">'+clayQuay(c.padX-16,c.base,c.W-c.padX*2+32,u)+'</g>';
    var gaps=[]; for(var q=1;q<6;q++) gaps.push(c.cx(q)+c.colW*0.5);

      body+='<g class="obj" style="--i:'+(i+1)+'">'+m.body+'</g>';
      lit+='<g class="amb" style="--i:'+i+'">'+m.lit+'</g>';
      fx+=m.fx;
    });

    [[-46,"lift",0,false],[42,"carry",.5,true]].forEach(function(p){
      fx+=clayWorker(c.cx(0)+p[0],top+2,30,u,{pose:p[1],o:p[2],flip:p[3]});});
    [[-50,"point",.2,false],[-26,"hold",.6,false],[34,"watch",1,true]].forEach(function(p){
      fx+=clayWorker(c.cx(1)+p[0],top+2,31,u,{pose:p[1],o:p[2],flip:p[3]});});
    labs+=clayCue("M "+n1(c.cx(1)+S*0.52)+" "+n1(top-S*0.9)+" V 196 h 26",
      n1(top-S*0.9-196+26),"Everything right of this gate is derived",n1(c.cx(1)+S*0.52+32),200.5,1,
      "start",[c.cx(1)+S*0.52,top-S*0.9]);
    return {sh:sh,body:body,lit:lit,fx:fx,labs:labs,
      far:clayHaze(140,c.W-130,c.base-40,u,17,0.58), near:clayNear(c.W,c.base+150,u),
      alt:"A clay model of a long workshop bench of seven machines: a hopper and a gatehouse with "
        +"figures at them, then a press, a rack, a geared drum, a rocking sieve and a lit kiln joined "
        +"by one overhead pipe, with nobody attending them."};
  });
};

/* ============ 04 · The Assay House ============
   One unit of work, with the roof taken off the shed so you can see into every
   bay — except the fourth, which keeps its roof, its walls and a single slot.
   Everything the judge is allowed is posted through that slot; everything it is
   not allowed simply has nowhere to go in. */
CLAY_SCENE["One unit of work, start to finish"]=function(f,title){
  var u=++ART_SEQ;
  return clayRow(u,f,title,446,function(c){
    var sh="",body="",lit="",fx="",labs="";
    var x0=c.padX+22, w=c.W-c.padX*2-44, flr=c.base-22, wallH=146, d=44;
    sh+=clayShadow(c.W/2,c.base+10,c.W*0.42,u,0.55);
    body+='<g class="obj" style="--i:0">'+clayQuay(c.padX-14,c.base,c.W-c.padX*2+28,u,{h:22,d:46})+'</g>';
    /* the shell: a back wall the length of the shed, coursed and pilastered so it
       reads as masonry, and four cross walls that make five bays. The near wall
       is the one that has been taken away. */
    body+='<g class="obj" style="--i:1">'+claySlab(x0,flr-2,w,wallH,d,CLAY.st,u,{r:9})+'</g>';
    var course="";
    for(var q=1;q<=2;q++) course+='<path d="M '+n1(x0+6)+' '+n1(flr-2-wallH*q/3)+' L '
      +n1(x0+w-6)+' '+n1(flr-2-wallH*q/3)+'" stroke="'+dark(CLAY.st.s,.2)+'" stroke-opacity=".3" '
      +'stroke-width="1.6"/>';
    for(var q2=1;q2<10;q2++){var px=x0+w*q2/10;
      course+='<path d="M '+n1(px)+' '+n1(flr-8)+' L '+n1(px)+' '+n1(flr-2-wallH+10)+'" stroke="'
        +lite(CLAY.st.hi,.2)+'" stroke-opacity=".16" stroke-width="3"/>';}
    body+='<g class="obj" style="--i:1">'+course
      +claySlab(x0+3,flr-2-wallH,w-6,9,d-4,CLAY.sn,u,{r:3.5})+'</g>';
    var bays=5, bw=w/bays;
    for(var k=1;k<bays;k++){
      var wx=x0+k*bw-8;
      body+='<g class="obj" style="--i:'+(k+1)+'">'+claySlab(wx,flr+d*0.42,16,wallH*0.76,d*0.86,
        CLAY.st,u,{r:5})+'</g>';
    }
    /* No roof on the shed. Four bays are open to the sky and you can see every
       thing in them; rafter stubs along the wall head say the lid was taken off
       rather than never built. The fifth bay is the exception, and it is the
       whole point of the drawing. */
    for(var rq=0;rq<13;rq++){
      var rx2=x0+18+rq*(w-36)/12;
      body+='<g class="obj" style="--i:2">'+claySlab(rx2,flr-2-wallH+7,9,7,d*0.44,CLAY.sn,u,{r:2.4})+'</g>';
    }
    lit+='<g class="amb" style="--i:2"><ellipse cx="'+n1(x0+w*0.5)+'" cy="'+n1(flr-wallH+14)
      +'" rx="'+n1(w*0.47)+'" ry="26" fill="url(#ww'+u+')" opacity=".22"/></g>';

    var cx=[], i;
    for(i=0;i<bays;i++) cx.push(x0+bw*(i+0.5));
    /* 1 — the chute the brief comes down, and the tiles it lands as */
    body+='<g class="obj" style="--i:3">'+clayCone(cx[0],flr-96,24,10,44,CLAY.sn,u)
      +clayTube("M "+n1(cx[0])+" "+n1(flr-96)+" L "+n1(cx[0])+" "+n1(flr-26),11,CLAY.sn)
      +clayTiles(cx[0]-18,flr,34,3,u,CLAY.sn,5)+'</g>';
    fx+=clayFlow("M "+n1(cx[0])+" "+n1(flr-140)+" L "+n1(cx[0])+" "+n1(flr-28),6,44,2.4,0);
    /* 2 — the bench, and the one figure doing the work */
    body+='<g class="obj" style="--i:4">'+claySlab(cx[1]-40,flr,80,18,32,CLAY.sn,u,{r:4})
      +clayCrate(cx[1]-28,flr-18,17,u,CLAY.st)+clayCrate(cx[1]+2,flr-18,20,u,CLAY.st)
      +clayCyl(cx[1]+34,flr-18,4,44,CLAY.sn,u)+'</g>';
    lit+=clayGlow(cx[1]+34,flr-66,5,u,WARM,{d:4});
    fx+=clayWorker(cx[1]-4,flr+2,36,u,{pose:"type",o:.2});
    /* 3 — the rack of checks, run by the house and watched by it */
    body+='<g class="obj" style="--i:5">'+claySlab(cx[2]-30,flr,60,104,26,CLAY.st,u,{r:7})+'</g>';
    for(i=0;i<5;i++) lit+=clayLit(cx[2]-22,flr-96+i*17,44,9,u,GLOW,{d:2.6,o:n1(i*0.44),r:4.5});
    /* 4 — the sealed bay: its own roof, its own walls, one slot */
    body+='<g class="obj" style="--i:6">'+claySlab(cx[3]-42,flr+d*0.3,84,116,d*0.78,CLAY.tc,u,{r:11})
      +claySlab(cx[3]-50,flr+d*0.3-116,100,15,d*0.94,CLAY.tc,u,{r:6})
      +clayDome(cx[3]-2,flr+d*0.3-131,30,17,CLAY.tc,u)
      +'<path d="'+rp([[cx[3]-44,flr-56],[cx[3]-14,flr-56],[cx[3]-14,flr-44],[cx[3]-44,flr-44]],5)
      +'" fill="'+dark(CLAY.tc.e,.5)+'" opacity=".7"/></g>';
    lit+=clayLit(cx[3]-44,flr-56,30,12,u,WARM,{d:3.2,r:5.5})
      +clayGlow(cx[3]-8,flr-142,6,u,WARM,{d:2.8});
    /* the conveyor that posts the three allowed things through the slot */
    var conv="M "+n1(cx[2]+32)+" "+n1(flr-50)+" L "+n1(cx[3]-46)+" "+n1(flr-50);
    body+='<g class="obj" style="--i:6">'+clayTube(conv,10,CLAY.sn)+'</g>';
    fx+=clayFlow(conv,6,40,2.2,.4);
    /* 5 — the dock the finished unit leaves by */
    var dk=modDock(cx[4],flr,96,u,{o:.9});
    body+='<g class="obj" style="--i:7">'+dk.body+'</g>'; lit+=dk.lit;
    fx+=clayWorker(cx[4]-44,flr+2,32,u,{pose:"push",o:.8});
    labs+=clayCue("M "+n1(cx[3]-48)+" "+n1(flr-104)+" V 200 H "+n1(cx[3]-96),
      n1(flr-104-200+48),"The only bay with a roof on it",n1(cx[3]-104),204.5,3,"end",
      [cx[3]-48,flr-104]);
    return {sh:sh,body:body,lit:lit,fx:fx,labs:labs,
      tagDx:cx.map(function(v,j){return v-c.cx(j);}),
      far:clayHaze(150,c.W-150,c.base-42,u,23,0.55), near:clayNear(c.W,c.base+160,u),
      alt:"A clay model of a five-bay assay house with the near wall and roof removed: a chute "
        +"delivering the brief, a bench where one figure builds, a rack of lit check lamps, a sealed "
        +"terracotta bay that keeps its own roof and has a single slot, and a dispatch dock."};
  });
};

/* ============ 05 · The Return Race ============
   Five stations on a quay, and a trough slung beneath them that carries a failed
   piece back to the start. The trough is what makes this a cycle rather than a
   pipeline. The tally post at its mouth is what stops it being an endless one:
   three beads, the last of them terracotta, and when that one is spent the piece
   is set aside with the reason recorded. */
CLAY_SCENE["The cycle, for one unit"]=function(f,title){
  var u=++ART_SEQ;
  return clayRow(u,f,title,398,function(c){
    var sh="",body="",lit="",fx="",labs="",top=c.base-24,S=104;
    var arm=f.arm||{}, fi=arm.from|0, ti=arm.to|0;
    sh+=clayShadow(c.W/2,c.base+8,c.W*0.44,u,0.52);
    body+='<g class="obj" style="--i:0">'+clayQuay(c.padX-16,c.base,c.W-c.padX*2+32,u)+'</g>';
    var gaps=[]; for(var q=0;q<4;q++) gaps.push(c.cx(q)+c.colW*0.5);
    var run=clayPipeRun(c.cx(0)+S*0.4,c.cx(4)-S*0.4,top-S*1.52,top,u,gaps);
    body+='<g class="obj" style="--i:1">'+run.body+'</g>'; fx+=run.fx;
    var build=[modHopper,null,modGate,modBooth,modDock];
    c.steps.forEach(function(st,i){
      sh+='<g class="sh" style="--i:'+i+'">'+clayShadow(c.cx(i),top,S*0.42,u,0.85)+'</g>';
      if(i===1){
        /* the builder: a bench, a lamp and one figure producing the evidence */
        body+='<g class="obj" style="--i:'+(i+1)+'">'
          +claySlab(c.cx(1)-42,top,84,20,34,CLAY.sn,u,{r:5})
          +clayCrate(c.cx(1)-30,top-20,19,u,CLAY.st)+clayCrate(c.cx(1)+4,top-20,22,u,CLAY.st)
          +clayCyl(c.cx(1)+38,top-20,4.4,58,CLAY.sn,u)+'</g>';
        lit+='<g class="amb" style="--i:1">'+clayGlow(c.cx(1)+38,top-82,5.4,u,WARM,{d:4.1})+'</g>';
        fx+=clayWorker(c.cx(1)-6,top+2,34,u,{pose:"type",o:.25});
        return;
      }
      var m=build[i](c.cx(i),top,S,u,{o:n1(i*0.34)});
      if(i===2){ /* the gauntlet: its layers stacked in the opening, cheapest lit first */
        for(var k=0;k<5;k++) m.lit+=clayLit(c.cx(2)-22,top-28-k*17,44,9,u,GLOW,
          {d:2.5,o:n1(k*0.4),r:4.5});
      }
      body+='<g class="obj" style="--i:'+(i+1)+'">'+m.body+'</g>';
      lit+='<g class="amb" style="--i:'+i+'">'+m.lit+'</g>';
      fx+=m.fx;
    });

    /* the trough, slung under the quay and running the other way */
    /* the trough drops into the clear lane between two captions, never through
       one: its ends sit in the gaps, not over the station they serve */
    var fxs=c.cx(fi)+c.colW*0.42, txs=c.cx(ti)-c.colW*0.36, yA=c.base+152;
    var trough="M "+n1(fxs)+" "+n1(c.base+12)+" C "+n1(fxs+4)+" "+n1(yA)+" "+n1(txs-4)+" "+n1(yA)
      +" "+n1(txs)+" "+n1(c.base+12);
    body+='<g class="obj" style="--i:'+(c.n+1)+'">'+clayTube(trough,16,CLAY.sn)+'</g>';
    fx+=clayFlow(trough,8,78,3.4,.5,WARM);
    body+='<g class="obj" style="--i:'+(c.n+2)+'">'+clayTally(fxs+20,c.base+10,3,1,u)+'</g>';
    lit+='<g class="amb" style="--i:'+c.n+'">'+clayGlow(fxs+20,c.base-32,4.4,u,WARM,{d:2.6})+'</g>';
    var mid=(fxs+txs)/2;
    labs+='<g class="lab" style="--i:'+c.n+'">'
      +'<text x="'+n1(mid)+'" y="'+n1(yA+26)+'" text-anchor="middle" font-size="13" font-weight="500" fill="'
        +ART_BLUE+'">'+esc(arm.label||"")+'</text>'
      +'<text x="'+n1(mid)+'" y="'+n1(yA+46)+'" text-anchor="middle" font-size="12" fill="'+ART_BLUE
        +'" opacity=".9">'+esc(arm.bound||"")+'</text>'
      +'<text x="'+n1(fxs+40)+'" y="'+n1(c.base-8)+'" font-size="12" font-weight="600" fill="'
        +ART_BLUE+'" opacity=".92">'+esc(arm.tick||"")+'</text></g>';
    return {sh:sh,body:body,lit:lit,fx:fx,labs:labs,extraH:146,
      far:clayHaze(150,c.W-150,c.base-40,u,31,0.58),
      alt:"A clay model of five stations on a quay — a hopper, a bench with one worker, a gatehouse "
        +"whose opening is stacked with lit check bars, a sealed terracotta booth and a dispatch dock — "
        +"with a trough slung beneath carrying a warm pulse back to the start past a three-bead tally post."};
  });
};
/* ============ 06 · The Sorting Wall ============
   A wall with three slots in it. Three things are posted through and arrive at
   the judging booth on the far side; a fourth is set down against a blank stretch
   of the same wall, where there is no slot and never was one. The refusal is not
   a rule anybody has to remember — it is a hole that was never cut. */
CLAY_SCENE["Who can see what"]=function(sc,title){
  var u=++ART_SEQ, W=1080, base=470, H=560;
  var pass=sc.passes||[], np=pass.length;
  var sh="",body="",lit="",fx="",labs="";
  sh+=clayShadow(W/2,base+10,W*0.42,u,0.55);
  body+='<g class="obj" style="--i:0">'+clayQuay(52,base,W-104,u,{h:24,d:44})+'</g>';
  var flr=base-24, wx=610, wallH=210, wt=46;
  /* the incoming conveyor, and the three things riding it */
  var slots=[flr-192, flr-142, flr-92];
  var items=[
    function(x,y){return clayTiles(x-20,y+8,40,3,u,CLAY.sn,5);},                 /* the criteria */
    function(x,y){return clayCrate(x-16,y+8,32,u,CLAY.st)                         /* the work */
      +claySlab(x-20,y+8,40,5,18,CLAY.sn,u,{r:2});},
    function(x,y){var g=claySlab(x-22,y+8,44,10,20,CLAY.st,u,{r:3});              /* the evidence */
      for(var k=0;k<3;k++) g+=clayCrate(x-18+k*13,y-2,11,u,CLAY.sn); return g;}
  ];
  for(var i=0;i<Math.min(3,np);i++){
    var y=slots[i], sx=250+i*38;
    var rail="M "+n1(sx-34)+" "+n1(y+4)+" L "+n1(wx-wt*0.62)+" "+n1(y+4);
    /* every conveyor stands on trestles; nothing in this world floats */
    var tre="";
    for(var t=0;t<4;t++){var tx=sx-24+t*(wx-wt*0.62-sx+18)/3.4;
      tre+=clayCyl(tx,flr,4.6,flr-y-4,CLAY.sn,u);}
    body+='<g class="obj" style="--i:'+(i+1)+'">'+tre+clayTube(rail,10,CLAY.sn)
      +claySlab(sx-40,y+9,52,9,20,CLAY.sn,u,{r:3})+items[i](sx,y-6)+'</g>';
    fx+=clayFlow(rail,6,52,2.6,n1(i*0.45));
    lit+='<g class="amb" style="--i:'+i+'">'+clayGlow(sx,y-16,4.4,u,GLOW,{d:3.4,o:n1(i*0.5)})+'</g>';
    labs+=clayTag(sx,y+26,i,i+1);
  }
  /* the wall: one long slab with three arched slots cut through it and a blank
     stretch at the near end that has none */
  var wall=claySlab(wx-wt/2,flr,wt,wallH,118,CLAY.st,u,{r:12})
    +claySlab(wx-wt/2-5,flr-wallH,wt+10,12,126,CLAY.sn,u,{r:4});
  for(i=0;i<3;i++){
    var sy=slots[i];
    wall+='<path d="'+rp([[wx-wt/2-1,sy-4],[wx+wt/2+1,sy-4],[wx+wt/2+1,sy+14],[wx-wt/2-1,sy+14]],7)
      +'" fill="'+dark(CLAY.st.e,.5)+'" opacity=".72"/>';
    lit+='<g class="amb" style="--i:'+i+'">'+clayLit(wx-wt/2+2,sy-1,wt-4,10,u,GLOW,
      {d:3.2,o:n1(i*0.42),r:4.4})+'</g>';
  }
  body+='<g class="obj" style="--i:'+(np+1)+'">'+wall+'</g>';
  labs+=clayTag(wx,flr+26,np+2,np+3);

  /* the fourth thing: brought right up to the wall, on a shelf at the height a
     slot would be if there were one, and nudging against blank stone */
  var rxs=wx-wt/2-52;
  body+='<g class="obj" style="--i:'+np+'">'
    +clayCyl(rxs-26,flr,4.6,flr-(flr-30),CLAY.sn,u)+clayCyl(rxs+18,flr,4.6,flr-(flr-30),CLAY.sn,u)
    +claySlab(rxs-40,flr-30,72,10,24,CLAY.sn,u,{r:3})+'</g>';
  fx+='<g class="tick" style="--d:4.6s;--rot:1.8deg;transform-box:view-box;transform-origin:'+n1(rxs-36)+'px '+n1(flr-40)+'px">'
    +clayScroll(rxs-4,flr-46,62,11,u)+'</g>';
  labs+=clayTag(rxs-4,flr-72,np,np+1);
  fx+=clayWorker(rxs-92,flr+2,32,u,{pose:"point",o:.3});

  /* the booth on the far side: one receiving slot, warm inside, and no opening
     that faces the near end of the wall */
  var bx=wx+164;
  sh+='<g class="sh" style="--i:'+(np+1)+'">'+clayShadow(bx,flr,54,u,0.85)+'</g>';
  body+='<g class="obj" style="--i:'+(np+3)+'">'+clayCyl(bx,flr,48,140,CLAY.tc,u)
    +clayCyl(bx,flr-140,38,10,CLAY.sn,u)+clayDome(bx,flr-150,38,26,CLAY.tc,u)
    +'<path d="'+rp([[bx-52,flr-92],[bx-16,flr-92],[bx-16,flr-78],[bx-52,flr-78]],6)
      +'" fill="'+dark(CLAY.tc.e,.5)+'" opacity=".7"/></g>';
  lit+=clayLit(bx-52,flr-92,36,14,u,WARM,{d:3.2,r:6})+clayGlow(bx,flr-182,7,u,WARM,{d:2.9});
  labs+=clayTag(bx,flr+26,np+1,np+2);
  /* the three, arriving */
  for(i=0;i<3;i++){
    var d2="M "+n1(wx+wt*0.62)+" "+n1(slots[i]+4)+" C "+n1(wx+86)+" "+n1(slots[i]+4)+" "
      +n1(bx-100)+" "+n1(flr-86)+" "+n1(bx-56)+" "+n1(flr-85);
    body+='<g class="obj" style="--i:'+(np+3)+'">'+clayTube(d2,8,CLAY.sn)+'</g>';
    fx+=clayFlow(d2,5,44,2.6,n1(i*0.45));
  }
  labs+=clayCue("M "+n1(wx-wt/2-4)+" "+n1(flr-34)+" V 196 h -28",n1(flr-34-196+28),
    "No slot was ever cut here",n1(wx-wt/2-36),200.5,3,"end",[wx-wt/2-4,flr-34]);
  labs+=clayCue("M "+n1(bx+50)+" "+n1(flr-150)+" V 224 H "+n1(W-90),
    n1(flr-150-224+Math.abs(W-90-bx-50)),"It cannot leak what it never receives",
    n1(W-82),228.5,4,"end",[bx+50,flr-150]);
  return clayFrame({u:u,w:W,h:H,title:title,deck:sc.caption||"",
    alt:"A clay model of a thick wall with three slots cut through it. Three objects ride conveyors "
      +"through the slots to a windowless terracotta booth on the far side; a fourth, a terracotta "
      +"scroll, rests against a blank stretch of the same wall where there is no slot.",
    far:clayHaze(140,W-140,base-40,u,41,0.55), shadow:sh, body:body, lit:lit, fx:fx,
    near:clayNear(W,H,u), note:labs});
};

/* ============ 07 · The Four Bays ============
   Four units go out at once because four is what one reviewer can take back. The
   fixture holds them side by side under a single brace; a unit that declares no
   write set gets a bay of its own, off to the side, because silence about files
   collides with everything. Everything downstream is one desk, one lamp and one
   stamp, and the queue in front of it is single file by construction. */
CLAY_SCENE["Four in the fixture, one writer"]=function(f,title){
  var u=++ART_SEQ;
  return clayRow(u,f,title,428,function(c){
    var sh="",body="",lit="",fx="",labs="",top=c.base-24, S=100;
    sh+=clayShadow(c.W/2,c.base+8,c.W*0.43,u,0.52);
    body+='<g class="obj" style="--i:0">'+clayQuay(c.padX-16,c.base,c.W-c.padX*2+32,u)+'</g>';
    var st=c.steps, xs=[c.cx(0),c.cx(1),c.cx(2),c.cx(3)];
    /* 1 — the ready set, each unit with its declared write list tied to it */
    var m0=modHopper(xs[0],top,S,u,{o:0});
    sh+='<g class="sh" style="--i:0">'+clayShadow(xs[0],top,S*0.42,u,0.85)+'</g>';
    body+='<g class="obj" style="--i:1">'+m0.body+'</g>'; lit+=m0.lit; fx+=m0.fx;
    fx+=clayWorker(xs[0]-44,top+2,30,u,{pose:"lift",o:0});

    /* 2 — the fixture: four bays under one brace */
    var bays=(st[1]&&st[1].branch)||[], bn=bays.length||4;
    var fw=c.colW*1.24, fx0=xs[1]-fw/2, cw=(fw-16)/bn;
    sh+='<g class="sh" style="--i:1">'+clayShadow(xs[1],top,fw*0.46,u,0.7)+'</g>';
    body+='<g class="obj" style="--i:2">'+claySlab(fx0,top,fw,16,34,CLAY.sn,u,{r:5})+'</g>';
    bays.forEach(function(b,k){
      var bx=fx0+8+k*cw+cw/2, bh=58+((k%2)*9);
      body+='<g class="obj" style="--i:'+(k+2)+'">'
        +claySlab(bx-cw*0.34,top-16,cw*0.16,26,16,CLAY.sn,u,{r:2.6})
        +claySlab(bx+cw*0.18,top-16,cw*0.16,26,16,CLAY.sn,u,{r:2.6})
        +claySlab(bx-cw*0.28,top-16,cw*0.56,bh,26,CLAY.st,u,{r:6})+'</g>';
      lit+='<g class="amb" style="--i:'+k+'">'+clayLit(bx-cw*0.2,top-16-bh*0.62,cw*0.4,10,u,GLOW,
        {d:3.2,o:n1(k*0.43),r:4})+'</g>';
      fx+=clayWorker(bx,top+2,26,u,{pose:k%2?"turn":"type",o:n1(k*0.37),d:1.5+k*0.11});
      labs+=clayTag(bx,c.footY,1,"2"+String.fromCharCode(97+k));
      labs+=clayCaption(bx,c.footY+32,artWrap(b.title,11),1);
    });
    /* the brace: these pieces are in the fixture at the same time */
    body+='<g class="obj" style="--i:'+(bn+2)+'">'
      +claySlab(fx0-6,top-104,fw+12,12,30,CLAY.st,u,{r:5})
      +clayCyl(fx0+4,top-16,5,88,CLAY.st,u)+clayCyl(fx0+fw-4,top-16,5,88,CLAY.st,u)+'</g>';

    /* 3 — the unit that declared nothing, in a bay of its own */
    var alone=(st[2]&&st[2].branch)||[{}];
    var ax=xs[2]-c.colW*0.1;
    sh+='<g class="sh" style="--i:2">'+clayShadow(ax,top,44,u,0.85)+'</g>';
    body+='<g class="obj" style="--i:'+(bn+3)+'">'+claySlab(ax-40,top,80,16,32,CLAY.sn,u,{r:5})
      +claySlab(ax-22,top-16,44,62,26,CLAY.st,u,{r:6})
      +clayRail(ax-42,ax+42,top-16,22,u)+'</g>';
    lit+='<g class="amb" style="--i:2">'+clayLit(ax-14,top-64,28,10,u,GLOW,{d:3.6,o:.9,r:4})+'</g>';
    labs+=clayTag(ax,c.footY,2,"3a");
    labs+=clayCaption(ax,c.footY+32,artWrap((alone[0]||{}).title||"Alone",13),2);
    fx+=clayWorker(ax+52,top+2,26,u,{pose:"watch",o:1.2,flip:true});

    /* 4 — one thread: one desk, one lamp, one stamp, and a single-file queue */
    var wxs=xs[3]+c.colW*0.1;
    sh+='<g class="sh" style="--i:3">'+clayShadow(wxs,top,52,u,0.9)+'</g>';
    body+='<g class="obj" style="--i:'+(bn+4)+'">'+claySlab(wxs-46,top,92,22,36,CLAY.sn,u,{r:6})
      +claySlab(wxs-34,top-22,68,10,28,CLAY.tc,u,{r:3})
      +clayCyl(wxs+38,top-22,5,64,CLAY.sn,u)+'</g>';
    fx+='<g class="bob" style="--d:2.4s"><g class="obj">'
      +claySlab(wxs-18,top-40,36,14,22,CLAY.st,u,{r:4})+'</g></g>';
    lit+=clayGlow(wxs+38,top-92,6,u,WARM,{d:3.4})

/* ============ 08 · The Cost Stair ============
   Eight rungs in the order they cost. Height is price: the first two need nothing
   a checkout does not already contain, and each one after that wants a database,
   a browser, a whole product, a measurement, a remote, or a person. The climb
   stopped at the third rung, so the handrail stops there too and the five above it
   are still unfired — the run never reached them and never paid for them. */
CLAY_SCENE["The eight layers, in cost order"]=function(f,title){
  var u=++ART_SEQ;
  return clayRow(u,f,title,442,function(c){
    var sh="",body="",lit="",fx="",labs="",S=76;
    var steps=c.steps, lastRun=steps.reduce(function(a,st,i){return st.ghost?a:i;},0);
    sh+=clayShadow(c.W/2,c.base+10,c.W*0.42,u,0.5);
    /* what each rung wants before it can run at all */
    function needs(i,x,y,ghost){
      var m=ghost?CLAY.gh:CLAY.sn, g="";
      if(i===2) g=clayCyl(x,y,17,30,ghost?CLAY.gh:CLAY.st,u)+clayDome(x,y-30,17,11,m,u);
      else if(i===3) g=claySlab(x-16,y,32,26,14,ghost?CLAY.gh:CLAY.st,u,{r:4})
        +clayCyl(x,y,6,5,m,u);
      else if(i===4) g=clayCyl(x-11,y,8,22,ghost?CLAY.gh:CLAY.st,u)
        +clayCyl(x+9,y,10,32,ghost?CLAY.gh:CLAY.st,u)+clayDome(x+9,y-32,10,8,m,u);
      else if(i===5) g=clayCyl(x,y,15,10,m,u)+clayDome(x,y-10,15,15,ghost?CLAY.gh:CLAY.st,u)
        +'<path d="M '+n1(x)+' '+n1(y-18)+' L '+n1(x+7)+' '+n1(y-24)+'" stroke="'+m.s
        +'" stroke-width="2.4" stroke-linecap="round"/>';
      else if(i===6) g=clayCyl(x,y,5,26,m,u)+clayDish(x,y-32,14,u,-34);
      else if(i===7) g=clayFig(x,y,32,u,{pose:"stand",m:ghost?CLAY.gh:CLAY.st});
      return g;
    }
    steps.forEach(function(st,i){
      var x=c.cx(i), h=(st.h||60)*1.15, ghost=!!st.ghost, top=c.base-h;
      var m=ghost?CLAY.gh:(i===lastRun?CLAY.tc:CLAY.sn);
      if(!ghost) sh+='<g class="sh" style="--i:'+i+'">'+clayShadow(x,c.base,c.colW*0.36,u,0.75)+'</g>';
      /* the rung itself: a fired block whose height is what it costs */
      body+='<g class="obj"'+(ghost?' opacity=".72"':"")+' style="--i:'+(i+1)+'">'
        +claySlab(x-c.colW*0.34,c.base,c.colW*0.68,h,34,m,u,{r:6})
        +claySlab(x-c.colW*0.37,c.base-h,c.colW*0.74,7,38,ghost?CLAY.gh:CLAY.sn,u,{r:3})
        +needs(i,x+c.colW*0.06,c.base-h-7,ghost)+'</g>';
      if(!ghost){
        lit+='<g class="amb" style="--i:'+i+'">'
          +clayLit(x-c.colW*0.24,c.base-h*0.5,c.colW*0.34,9,u,i===lastRun?WARM:GLOW,
            {d:i===lastRun?1.9:3.4,o:n1(i*0.4),r:4})+'</g>';
      }
      if(i===lastRun){
        /* the climber, stopped where the run stopped */
        fx+=clayWorker(x-c.colW*0.2,c.base-h-7,30,u,{pose:"point",o:.2});
        lit+=clayGlow(x+c.colW*0.06,c.base-h-46,6,u,WARM,{d:1.9});
      }

    /* the handrail: it ends where the run ended, because nothing carried on past it */
    var r0=c.cx(0)-c.colW*0.4, r1=c.cx(lastRun)+c.colW*0.4, rail="M "+n1(r0)+" "
      +n1(c.base-(steps[0].h||44)*1.15-30)+" L "+n1(r1)+" "+n1(c.base-(steps[lastRun].h||72)*1.15-30);
    body+='<g class="obj" style="--i:1">'+clayTube(rail,9,CLAY.sn)
      +clayCyl(r0+6,c.base-(steps[0].h||44)*1.15-7,4,24,CLAY.sn,u)
      +clayCyl(r1-6,c.base-(steps[lastRun].h||72)*1.15-7,4,24,CLAY.sn,u)+'</g>';
    fx+=clayFlow(rail,6,58,2.8,0);
    labs+=clayCue("M "+n1(c.cx(lastRun)+c.colW*0.36)+" "+n1(c.base-(steps[lastRun].h||72)*1.15-52)
      +" V 208 h 24",n1(c.base-(steps[lastRun].h||72)*1.15-52-208+24),
      "The climb stopped here, and so does the rail",
      n1(c.cx(lastRun)+c.colW*0.36+30),212.5,2,"start",
      [c.cx(lastRun)+c.colW*0.36,c.base-(steps[lastRun].h||72)*1.15-52]);
    labs+=clayCue("M "+n1(c.cx(6))+" "+n1(c.base-(steps[6].h||128)*1.15-40)+" V 248 h -26",
      n1(c.base-(steps[6].h||128)*1.15-40-248+26),"Never fired: these never ran",
      n1(c.cx(6)-32),252.5,5,"end",[c.cx(6),c.base-(steps[6].h||128)*1.15-40]);
    return {sh:sh,body:body,lit:lit,fx:fx,labs:labs,
      far:clayHaze(150,c.W-150,c.base-30,u,53,0.45), near:clayNear(c.W,c.base+140,u),
      alt:"A clay model of eight rising rungs whose height is their cost. The first two are plain "
        +"stone, the third is terracotta and lit with a figure stopped on it, and the five above it are "
        +"unfired grey clay. The handrail ends at the third rung."};
  });

/* ============ 09 · The Word Mill ============
   Loose words go in at one end and one agreed vocabulary comes out at the other.
   The tumbler groups what is the same; the desk in the middle is the only place a
   collision is allowed to be settled, and it is settled by asking; the press
   stamps exactly one term per concept and drops the rest in the synonym tray; the
   cabinet binds a word that must mean two things to the context each meaning
   belongs to; and the board is where the finished glossary is posted. */
CLAY_SCENE["How the language is derived"]=function(f,title){
  var u=++ART_SEQ;
  return clayRow(u,f,title,414,function(c){
    var sh="",body="",lit="",fx="",labs="",top=c.base-24,S=98;
    sh+=clayShadow(c.W/2,c.base+8,c.W*0.44,u,0.52);
    body+='<g class="obj" style="--i:0">'+clayQuay(c.padX-16,c.base,c.W-c.padX*2+32,u)+'</g>';
    var gaps=[]; for(var q=0;q<5;q++) gaps.push(c.cx(q)+c.colW*0.5);
    var run=clayPipeRun(c.cx(0)+S*0.4,c.cx(5)-S*0.44,top-S*1.52,top,u,gaps);
    body+='<g class="obj" style="--i:1">'+run.body+'</g>'; fx+=run.fx;
    var build=[modHopper,modTumbler,modDesk,modPress,modCabinet,modBoard];
    c.steps.forEach(function(st,i){
      var m=build[Math.min(i,build.length-1)](c.cx(i),top,S,u,{o:n1(i*0.33),d:7+i});
      sh+='<g class="sh" style="--i:'+i+'">'+clayShadow(c.cx(i),top,S*0.42,u,0.85)+'</g>';
      body+='<g class="obj" style="--i:'+(i+2)+'">'+m.body+'</g>';
      lit+='<g class="amb" style="--i:'+i+'">'+m.lit+'</g>';
      fx+=m.fx;
    });
    /* the only two people in the mill, and they are at the interview */
    fx+=clayWorker(c.cx(0)-42,top+2,29,u,{pose:"lift",o:0});
    fx+=clayWorker(c.cx(2)-46,top+2,30,u,{pose:"point",o:.3});
    fx+=clayWorker(c.cx(2)+46,top+2,30,u,{pose:"hold",o:.9,flip:true});
    /* the synonym tray under the press: one term wins, the others are kept */
    body+='<g class="obj" style="--i:5">'+claySlab(c.cx(3)+S*0.3,top,S*0.4,S*0.1,S*0.28,
      CLAY.sn,u,{r:3})+'</g>';
    for(var k=0;k<3;k++) body+='<g class="obj" style="--i:5">'+clayCrate(c.cx(3)+S*0.34+k*S*0.11,
      top-S*0.1,S*0.09,u,CLAY.sn)+'</g>';
    labs+=clayCue("M "+n1(c.cx(2))+" "+n1(top-S*0.95)+" V 200 h -24",n1(top-S*0.95-200+24),
      "A collision is settled by asking, never by picking",n1(c.cx(2)-30),204.5,2,"end",
      [c.cx(2),top-S*0.95]);
    labs+=clayCue("M "+n1(c.cx(3)+S*0.44)+" "+n1(top-S*0.3)+" V 236 H "+n1(c.W-90),
      n1(top-S*0.3-236+Math.abs(c.W-90-c.cx(3)-S*0.44)),"One term wins; the rest are kept as synonyms",
      n1(c.W-82),240.5,3,"end",[c.cx(3)+S*0.44,top-S*0.3]);
    return {sh:sh,body:body,lit:lit,fx:fx,labs:labs,
      far:clayHaze(150,c.W-150,c.base-40,u,59,0.55), near:clayNear(c.W,c.base+150,u),
      alt:"A clay model of a word mill: a hopper of loose tiles, a turning sorting drum, a lit desk "
        +"with a bell where two figures settle a collision, a screw press stamping one tile with a "
        +"synonym tray beside it, a cabinet of labelled drawers, and a lit noticeboard."};
  });
};

/* ============ 10 · The Four Islands ============
   Four contexts as four islands. Two arched bridges carry work one way — authored
   intent to derived work, derived work to a verified build — and a lower pipe
   carries status back the other way, which is the only return path in the map.
   Presentation stands apart at the front with a dish that turns: every island
   publishes through it, and none of them depends on it. */
CLAY_SCENE["Context map"]=function(f,title){
  var u=++ART_SEQ, W=1080, H=782, steps=f.steps||[];
  var sh="",body="",lit="",fx="",labs="";

  var mats=[CLAY.st,CLAY.st,CLAY.tc,CLAY.st];

  function bridge(a,b,dip,w){
    var mx=(a.x+b.x)/2, my=Math.min(a.y,b.y)-dip;
    return "M "+n1(a.x+a.r*0.72)+" "+n1(a.y-16)+" Q "+n1(mx)+" "+n1(my)+" "+n1(b.x-b.r*0.72)+" "+n1(b.y-16);
  }
  var b01=bridge(isle[0],isle[1],54), b12=bridge(isle[1],isle[2],54);
  var ret="M "+n1(isle[2].x-isle[2].r*0.5)+" "+n1(isle[2].y+16)+" C "+n1(isle[2].x-160)+" "
    +n1(isle[2].y+92)+" "+n1(isle[1].x+150)+" "+n1(isle[1].y+96)+" "+n1(isle[1].x+isle[1].r*0.5)

  body+='<g class="obj" style="--i:1">'+clayTube(b01,15,CLAY.sn)+clayTube(b12,15,CLAY.sn)
    +clayTube(ret,12,CLAY.sn)+'</g>';
  fx+=clayFlow(b01,8,72,3,0)+clayFlow(b12,8,72,3,1.1)+clayFlow(ret,6,64,3.4,.5,WARM);
  steps.forEach(function(st,i){
    var o=isle[i], m=mats[i];
    sh+='<g class="sh" style="--i:'+i+'">'+clayShadow(o.x,o.y,o.r,u,0.62)+'</g>';
    body+='<g class="obj" style="--i:'+(i+2)+'">'+clayPlinth(o.x,o.y,o.r,u,{h:20})+'</g>';
    var g="";
    if(i===0){ /* authored intent: a scriptorium of stacked tiles under a lamp */
      g=clayCyl(o.x-24,o.y-25,26,64,m,u)+clayDome(o.x-24,o.y-89,25,17,CLAY.sn,u)
        +clayTiles(o.x+14,o.y-25,34,4,u,CLAY.sn,6)+clayCyl(o.x+46,o.y-25,4,44,CLAY.sn,u);
      lit+=clayGlow(o.x+46,o.y-73,5,u,WARM,{d:4})
        +clayLit(o.x-36,o.y-70,20,14,u,GLOW,{d:3.4});
      fx+=clayWorker(o.x-56,o.y-23,28,u,{pose:"type",o:.2});
    } else if(i===1){ /* derived work: a calculating drum on a ring balcony */
      g=clayCyl(o.x,o.y-25,34,72,m,u)+clayDome(o.x,o.y-97,33,22,CLAY.sn,u)
        +clayRail(o.x-58,o.x+58,o.y-25,16,u);
      lit+=clayLit(o.x-24,o.y-76,20,15,u,GLOW,{d:3.2})+clayLit(o.x+4,o.y-76,20,15,u,GLOW,{d:4.1,o:.7})
        +clayGlow(o.x,o.y-122,6,u,WARM,{d:3});
      fx+=clayGear(o.x+44,o.y-64,17,10,CLAY.sn,u,{d:9});
    } else if(i===2){ /* the verified build: the one lit kiln in the map */
      g=clayCyl(o.x,o.y-25,32,84,m,u)+clayCyl(o.x,o.y-109,25,8,CLAY.sn,u)

        lit+=clayLit(o.x-22+j*22,o.y-92+k*26,15,17,u,WARM,{d:3.4+k*0.6,o:n1(j*0.5+k*0.9)});
      lit+=clayGlow(o.x,o.y-138,6,u,WARM,{d:2.9});
      fx+=clayPuff(o.x+12,o.y-132,7,u,5.2,0)+clayPuff(o.x+12,o.y-132,5.5,u,5.2,2.4);
    } else { /* presentation: a broadcast mast every island publishes through */
      g=clayCyl(o.x,o.y-25,24,54,m,u)+clayCyl(o.x,o.y-79,13,34,CLAY.sn,u)

      lit+=clayLit(o.x-15,o.y-62,22,16,u,GLOW,{d:3.6})+clayGlow(o.x,o.y-118,5.4,u,GLOW,{d:2.6});

      fx+='<g class="tick" style="--d:7.2s;--rot:16deg;transform-box:view-box;transform-origin:'+n1(o.x)+'px '

        +n1(o.x)+' '+n1(o.y-104)+')"/>'
        +'<path d="'+ell(o.x,o.y-104,26,7)+'" fill="'+CLAY.sn.s+'" opacity=".5"/>'
        +'<path d="M '+n1(o.x)+' '+n1(o.y-104)+' L '+n1(o.x)+' '+n1(o.y-122)+'" stroke="'+CLAY.st.f
        +'" stroke-width="3.4" stroke-linecap="round"/>'
        +'<circle cx="'+n1(o.x)+'" cy="'+n1(o.y-124)+'" r="4.4" fill="'+CLAY.st.f+'"/></g>';

/* ============ 11 · The Distillation Train ============
   Eight vessels on one bench, each smaller than the one before it and joined to
   it by a tube. Nothing is added along the train; the same material is carried
   into a narrower and narrower vessel until what comes out the far end is
   specific enough to build from. Between the first two there is a stopcock, and
   a figure with both hands on its wheel: nothing goes past an unanswered fork. */
CLAY_SCENE["Flow A — Specification chain"]=function(f,title){
  var u=++ART_SEQ;
  return clayRow(u,f,title,410,function(c){
    var sh="",body="",lit="",fx="",labs="",top=c.base-24, n=c.n;

    c.steps.forEach(function(st,i){
      var x=c.cx(i), s=S[i], kind=st.kind||"", last=(i===n-1);

          +'<circle cx="'+n1(x)+'" cy="'+n1(top-s*1.08)+'" r="'+n1(s*0.26)+'" fill="none" stroke="'
          +CLAY.st.f+'" stroke-width="'+n1(s*0.07)+'"/>';

        fx+='</g>';
        lit+='<g class="amb" style="--i:'+i+'">'+clayGlow(x+s*0.28,top-s*0.7,s*0.055,u,WARM,
          {d:3.4,o:n1(i*0.3)})+'</g>';
        fx+=clayWorker(x-s*0.46,top+2,30,u,{pose:"turn",o:.2});
      } else if(kind==="input"){
        var m0=modHopper(x,top,s*1.0,u,{o:0});
        body+='<g class="obj" style="--i:'+(i+2)+'">'+m0.body+'</g>'; lit+=m0.lit; fx+=m0.fx;
        fx+=clayWorker(x-s*0.5,top+2,29,u,{pose:"lift",o:0});
      } else {
        var mv=modVessel(x,top,s,u,{o:n1(i*0.31)});
        if(last){
          body+='<g class="obj" style="--i:'+(i+2)+'">'
            +clayCyl(x,top,s*0.4,s*0.16,CLAY.sn,u)
            +'<ellipse cx="'+n1(x)+'" cy="'+n1(top-s*0.16-s*0.4)+'" rx="'+n1(s*0.46)+'" ry="'
              +n1(s*0.42)+'" fill="url(#tcd'+u+')"/>'
            +clayCyl(x,top-s*0.16-s*0.74,s*0.13,s*0.3,CLAY.tc,u)+'</g>';
          lit+='<g class="amb" style="--i:'+i+'">'+clayGlow(x,top-s*0.56,s*0.2,u,WARM,{d:2.9})+'</g>';
        } else {
          body+='<g class="obj" style="--i:'+(i+2)+'">'+mv.body+'</g>';
          lit+='<g class="amb" style="--i:'+i+'">'+mv.lit+'</g>';
        }
      }
      /* the tube to the next vessel, always leaving the neck and entering the belly */
      if(i<n-1){
        var nx=c.cx(i+1), ns=S[i+1];
        var d2="M "+n1(x+s*0.12)+" "+n1(top-s*0.62)+" C "+n1(x+c.colW*0.42)+" "+n1(top-s*0.9)+" "
          +n1(nx-c.colW*0.42)+" "+n1(top-ns*0.9)+" "+n1(nx-ns*0.3)+" "+n1(top-ns*0.62);
        body+='<g class="obj" style="--i:'+(i+2)+'">'+clayTube(d2,s*0.1,CLAY.sn)+'</g>';
        fx+=clayFlow(d2,s*0.055,54,2.8,n1(i*0.33));
      }
    });
    labs+=clayCue("M "+n1(c.cx(1))+" "+n1(top-104)+" V 196 h -24",n1(top-104-196+24),
      "Nothing goes past an unanswered fork",n1(c.cx(1)-30),200.5,1,"end",[c.cx(1),top-104]);
    labs+=clayCue("M "+n1(c.cx(6))+" "+n1(top-72)+" V 232 H "+n1(c.W-92),
      n1(top-72-232+Math.abs(c.W-92-c.cx(6))),"Each vessel is narrower than the last",
      n1(c.W-84),236.5,5,"end",[c.cx(6),top-72]);
    return {sh:sh,body:body,lit:lit,fx:fx,labs:labs,
      far:clayHaze(150,c.W-150,c.base-40,u,67,0.5), near:clayNear(c.W,c.base+150,u),
      alt:"A clay model of a distillation train: eight bellied vessels on a stone bench, each smaller "
        +"than the last and joined neck to belly by tubes, with a stopcock and a figure turning its "
        +"wheel between the first two, and a lit terracotta vessel at the end."};
  });
};

/* ============ 12 · The Calculating Engine ============
   A plan is not written beside a specification, it is calculated out of one. The
   frozen block goes in at the left; a spine is laid, detail is hung off it, and
   the geared press turns the crank. Then everything falls through a sieve, and
   the one bead the mesh catches — a requirement no task claims — is why the
   engine stops rather than why somebody gets an email. */
CLAY_SCENE["Flow B — Plan derivation"]=function(f,title){
  var u=++ART_SEQ;
  return clayRow(u,f,title,416,function(c){
    var sh="",body="",lit="",fx="",labs="",top=c.base-24,S=100;
    sh+=clayShadow(c.W/2,c.base+8,c.W*0.44,u,0.52);
    body+='<g class="obj" style="--i:0">'+clayQuay(c.padX-16,c.base,c.W-c.padX*2+32,u)+'</g>';
    var gaps=[]; for(var q=0;q<5;q++) gaps.push(c.cx(q)+c.colW*0.5);
    var run=clayPipeRun(c.cx(0)+S*0.42,c.cx(5)-S*0.44,top-S*1.52,top,u,gaps);
    body+='<g class="obj" style="--i:1">'+run.body+'</g>'; fx+=run.fx;
    c.steps.forEach(function(st,i){
      var x=c.cx(i);
      sh+='<g class="sh" style="--i:'+i+'">'+clayShadow(x,top,S*0.42,u,0.85)+'</g>';
      if(i===0){
        /* the frozen block: a pale slab on a feed tray, lit cold from inside */
        body+='<g class="obj" style="--i:2">'+claySlab(x-S*0.38,top,S*0.76,S*0.14,S*0.32,CLAY.sn,u,{r:4})
          +claySlab(x-S*0.28,top-S*0.14,S*0.56,S*0.62,S*0.28,CLAY.sn,u,{r:S*0.08})+'</g>';
        lit+='<g class="amb" style="--i:0">'+clayLit(x-S*0.2,top-S*0.6,S*0.4,S*0.1,u,GLOW,
          {d:4.2,still:true,r:S*0.04})+clayGlow(x,top-S*0.44,S*0.13,u,GLOW,{d:5,o:0})+'</g>';
        fx+=clayWorker(x-S*0.52,top+2,29,u,{pose:"carry",o:0});
      } else if(i===1||i===2){
        /* the spine, and the detail hung off it */
        var vn=(i===1)?4:5, sp=S*0.16;
        var g=claySlab(x-S*0.42,top,S*0.84,S*0.1,S*0.3,CLAY.sn,u,{r:3});
        for(var v=0;v<vn;v++){
          var vx=x-S*0.36+v*(S*0.72/(vn-1));
          g+=claySlab(vx-sp*0.4,top-S*0.1,sp*0.8,S*(i===1?0.5:0.62),S*0.24,CLAY.st,u,{r:sp*0.2});
          if(i===2) g+=claySlab(vx-sp*0.28,top-S*0.1-S*0.62,sp*0.56,S*0.12,S*0.16,CLAY.sn,u,{r:2.4});
        }
        body+='<g class="obj" style="--i:'+(i+2)+'">'+g+'</g>';
        for(var v2=0;v2<vn;v2++)
          lit+='<g class="amb" style="--i:'+i+'">'+clayLit(x-S*0.36+v2*(S*0.72/(vn-1))-S*0.05,
            top-S*(i===1?0.44:0.56),S*0.1,S*0.06,u,GLOW,{d:3.4,o:n1(v2*0.4+i*0.3),r:2.6})+'</g>';
        fx+=clayWorker(x+S*0.5,top+2,29,u,{pose:i===1?"lift":"point",o:n1(i*0.4),flip:true});
      } else if(i===3){
        /* the press that turns the crank and prints the sheets */
        var md=modDrum(x,top,S,u,{o:.8,gd:8});
        body+='<g class="obj" style="--i:5">'+md.body
          +clayTiles(x+S*0.44,top,S*0.3,4,u,CLAY.sn,S*0.05)+'</g>';
        lit+='<g class="amb" style="--i:3">'+md.lit+'</g>'; fx+=md.fx;
      } else if(i===4){
        var ms=modSieve(x,top,S,u,{o:1.1});
        body+='<g class="obj" style="--i:6">'+ms.body+'</g>';
        lit+='<g class="amb" style="--i:4">'+ms.lit+'</g>'; fx+=ms.fx;
      } else {
        var mb=modBoard(x,top,S,u,{o:1.4});
        body+='<g class="obj" style="--i:7">'+mb.body+'</g>';
        lit+='<g class="amb" style="--i:5">'+mb.lit+'</g>'; fx+=mb.fx;
      }
    });
    labs+=clayCue("M "+n1(c.cx(0)+S*0.34)+" "+n1(top-S*0.82)+" V 196 h 24",n1(top-S*0.82-196+24),
      "Frozen before anything is derived from it",n1(c.cx(0)+S*0.34+30),200.5,0,"start",
      [c.cx(0)+S*0.34,top-S*0.82]);
    labs+=clayCue("M "+n1(c.cx(4)+S*0.16)+" "+n1(top-S*0.6)+" V 234 H "+n1(c.W-92),
      n1(top-S*0.6-234+Math.abs(c.W-92-c.cx(4)-S*0.16)),"One bead caught, and the engine stops",
      n1(c.W-84),238.5,4,"end",[c.cx(4)+S*0.16,top-S*0.6]);
    return {sh:sh,body:body,lit:lit,fx:fx,labs:labs,
      far:clayHaze(150,c.W-150,c.base-40,u,71,0.5), near:clayNear(c.W,c.base+150,u),
      alt:"A clay model of a calculating engine: a cold-lit frozen block on a feed tray, a spine of "
        +"blocks laid on a rail, detail tiles hung off it, a geared drum printing sheets, a rocking "
        +"sieve holding one glowing bead, and a lit noticeboard of finished plan tiles."};
  });
};

/* ============ 13 · The Loop Track ============
   One iteration, and then the same iteration again. The track is a closed ring
   on a plinth, so the picture has no end to point at; what makes it terminate is
   not the shape but the ready set, which eventually contains nothing. In the
   middle stands the three-cylinder engine every unit is built by — write the
   failing test, make it pass, clean up under a green suite — firing in that order
   and no other. */
CLAY_SCENE["Flow C — Autonomous execution"]=function(f,title){
  var u=++ART_SEQ, W=1080, cx=W*0.5, cy=400, RX=290, RY=RX*K*0.84, H=Math.round(cy+RY+186);
  var steps=f.steps||[], sh="",body="",lit="",fx="",labs="";
  /* the base is the ring itself: a raised stone roadbed following the track,
     rather than a filled disc that would swallow the bottom of the frame */
  var track=ell(cx,cy,RX*0.82,RY*0.82);
  sh+='<g><ellipse cx="'+n1(cx+14)+'" cy="'+n1(cy+RY*0.82+16)+'" rx="'+n1(RX*0.96)+'" ry="'
    +n1(RY*1.15)+'" fill="url(#cs'+u+')" opacity=".4"/></g>';
  body+='<g class="obj" style="--i:0">'+clayTube(track,46,CLAY.sn)+'</g>';
  body+='<g class="obj" style="--i:1">'+clayTube(track,15,CLAY.sn)+'</g>';
  fx+=clayFlow(track,6,150,7,0)+clayFlow(track,5,150,7,2.3)+clayFlow(track,4,150,7,4.6);
  var ring=[], bi=-1;
  steps.forEach(function(st,k){ if(st.branch) bi=k; else ring.push(k); });
  /* the stations, spread right round the ring so the loop has no visible start */
  var A=[196,268,340,52,124];
  ring.forEach(function(k,j){
    var a=(A[j%A.length])*Math.PI/180;
    var x=cx+Math.cos(a)*RX*0.82, y=cy+Math.sin(a)*RY*0.82;
    var st=steps[k], kind=st.kind||"", last=(k===steps.length-1), g="";
    sh+='<g class="sh" style="--i:'+j+'">'+clayShadow(x,y,30,u,0.78)+'</g>';
    if(kind==="input"){
      g=claySlab(x-24,y,48,13,22,CLAY.sn,u,{r:4})+clayTiles(x-18,y-13,36,4,u,CLAY.sn,4.6)
        +clayCyl(x+22,y-13,4,40,CLAY.sn,u);
      lit+='<g class="amb" style="--i:'+j+'">'+clayGlow(x+22,y-57,4.6,u,WARM,{d:4})
        +clayLit(x-14,y-34,28,6,u,GLOW,{d:3.4,r:2.6})+'</g>';
    } else if(kind==="gate"){
      g=clayArch(x,y,58,82,24,u);
      for(var q=0;q<4;q++) lit+='<g class="amb" style="--i:'+j+'">'
        +clayLit(x-16,y-24-q*14,32,7,u,GLOW,{d:2.5,o:n1(q*0.4),r:3.4})+'</g>';
      lit+='<g class="amb" style="--i:'+j+'">'+clayGlow(x,y-72,4.6,u,WARM,{d:3.4})+'</g>';
    } else if(last||kind==="accent"){
      g=claySlab(x-27,y,54,16,26,CLAY.tc,u,{r:5})+clayCyl(x-16,y-16,4.6,42,CLAY.tc,u)
        +clayCyl(x+16,y-16,4.6,42,CLAY.tc,u)+claySlab(x-23,y-58,46,11,24,CLAY.tc,u,{r:4});
      fx+='<g class="bob" style="--d:2.2s">'+claySlab(x-14,y-28,28,11,18,CLAY.st,u,{r:3})+'</g>';
      lit+='<g class="amb" style="--i:'+j+'">'+clayLit(x-18,y-46,36,7,u,WARM,{d:3,r:3})
        +clayGlow(x,y-70,5,u,WARM,{d:2.7})+'</g>';
    } else {
      g=clayCyl(x,y,24,58,CLAY.st,u)+clayDome(x,y-58,23,15,CLAY.sn,u);
      for(var p2=0;p2<5;p2++) g+='<path d="M '+n1(x-16+p2*8)+' '+n1(y-58)+' L '+n1(x-16+p2*8)+' '
        +n1(y-70)+'" stroke="'+CLAY.sn.s+'" stroke-width="2.2" stroke-linecap="round"/>';
      lit+='<g class="amb" style="--i:'+j+'">'+clayLit(x-14,y-40,12,14,u,GLOW,{d:3.3,o:n1(j*0.3)})
        +clayLit(x+3,y-40,12,14,u,GLOW,{d:4.1,o:n1(j*0.5)})+'</g>';
    }
    body+='<g class="obj" style="--i:'+(j+2)+'">'+g+'</g>';
    /* labels sit outside the ring, on the radius, so nothing crosses the track */
    /* a station standing at the top or the bottom of the ellipse has no room
       above or below it, so its label steps sideways instead */
    var ca=Math.cos(a), up=(y<cy), lx, ly;
    if(Math.abs(ca)<0.36){ lx=cx+(up?-192:192); ly=y+(up?-40:66); }
    else { lx=cx+ca*(RX*0.82+58); ly=y+(up?-118:78); }
    labs+=clayTag(lx,ly,j,k+1);
    labs+=clayCaption(lx,ly+30,artWrap(st.title,15),j);
  });
  /* the engine inside the ring: three cylinders, firing in one order and no other */
  if(bi>=0){
    var br=steps[bi].branch||[], bn=br.length, ex=cx, ey=cy+RY*0.2;
    sh+='<g class="sh" style="--i:6">'+clayShadow(ex,ey,60,u,0.8)+'</g>';
    body+='<g class="obj" style="--i:8">'+clayPlinth(ex,ey,58,u,{h:14})+'</g>';
    br.forEach(function(b,k){
      var bx=ex+(k-(bn-1)/2)*38, bh=54;
      body+='<g class="obj" style="--i:'+(k+9)+'">'+clayCyl(bx,ey-15,15,bh,CLAY.st,u)
        +clayCyl(bx,ey-15-bh,10,6,CLAY.sn,u)+'</g>';
      fx+='<g class="bob" style="--d:1.8s;--o:'+n1(k*0.6)+'s">'
        +clayCyl(bx,ey-15-bh-6,6,22,CLAY.sn,u)+'</g>';
      lit+='<g class="amb" style="--i:'+(k+6)+'">'+clayLit(bx-8,ey-15-bh*0.58,16,11,u,
        k===0?WARM:GLOW,{d:1.8,o:n1(k*0.6),r:3.6})+'</g>';
      labs+=clayTag(bx,ey+30,k+6,(bi+1)+String.fromCharCode(97+k));
    });

  }
  fx+=clayWorker(cx-RX*0.5,cy+RY*1.06,30,u,{pose:"watch",o:.4});
  labs+=clayCue("",0,"A ring has no end — the ready set is what empties",n1(W-70),210,3,"end",
    [cx+RX*0.64,cy-RY*0.82]);
  return clayFrame({u:u,w:W,h:H,title:title,deck:f.caption||"",
    alt:"A clay model of a closed ring rail on a round plinth with five stations spaced around it and "
      +"a three-cylinder engine standing inside the ring, its pistons rising one after another.",
    far:clayHaze(160,W-160,cy-RY-26,u,79,0.45), shadow:sh, body:body, lit:lit, fx:fx, note:labs});
};

/* ---------------- section renderers ---------------- */
var R = {};

R.prose = function(s){
  var h="";
  if(s.body) h += s.body.map(function(p){return "<p>"+rich(p)+"</p>";}).join("");
  if(s.highlights) h += '<div class="grid g2" style="margin-top:var(--space-3)">'+s.highlights.map(function(t){
    return '<div class="tile">'+(t.label?'<div class="k">'+esc(t.label)+"</div>":"")+
      "<h4>"+esc(t.title)+"</h4><p>"+rich(t.text)+"</p></div>";}).join("")+"</div>";
  if(s.note) h += '<div class="note '+(s.note.kind||"")+'" style="margin-top:var(--space-3)"><b>'+
    esc(s.note.label||"Note")+"</b> "+rich(s.note.text)+"</div>";
  return h;
};

R.stats = function(s){
  return '<div class="grid g3">'+s.items.map(function(t){
    return '<div class="tile stat"><div class="v">'+esc(t.value)+'</div><div class="l">'+esc(t.label)+"</div>"+
      (t.note?'<div class="n">'+rich(t.note)+"</div>":"")+"</div>";}).join("")+"</div>";
};

R.list = function(s){
  var h = s.intro?'<p class="lede">'+rich(s.intro)+"</p>":"";
  function render(items,ordered){
    var tag = ordered?"ol":"ul";
    return "<"+tag+' class="plain">'+items.map(function(i){
      if(typeof i==="string") return "<li>"+rich(i)+"</li>";
      return "<li><strong>"+esc(i.title)+"</strong>"+(i.text?" — "+rich(i.text):"")+"</li>";
    }).join("")+"</"+tag+">";
  }
  if(s.groups) h += '<div class="grid g2">'+s.groups.map(function(g){
    return '<div class="tile"><div class="k">'+esc(g.label||"")+"</div><h4>"+esc(g.title)+"</h4>"+
      render(g.items,g.ordered)+"</div>";}).join("")+"</div>";
  else h += render(s.items,s.ordered);
  return h;
};

R.defs = function(s){
  return (s.intro?'<p class="lede">'+rich(s.intro)+"</p>":"")+'<dl class="defs">'+s.items.map(function(i){
    return "<div><dt>"+rich(i.term)+"</dt><dd>"+rich(i.def)+"</dd></div>";}).join("")+"</dl>";
};

R.table = function(s){
  var h = s.intro?'<p class="lede">'+rich(s.intro)+"</p>":"";
  var mono = s.mono||[];
  h += '<div class="tblwrap"><table><thead><tr>'+s.columns.map(function(c,i){
    return "<th"+(mono.indexOf(i)>=0?' class="m"':"")+">"+esc(c)+"</th>";}).join("")+"</tr></thead><tbody>";
  h += s.rows.map(function(r){
    return '<tr data-search="'+esc(r.join(" ").toLowerCase())+'">'+r.map(function(c,i){
      return "<td"+(mono.indexOf(i)>=0?' class="m"':"")+">"+rich(c)+"</td>";}).join("")+"</tr>";}).join("");
  return h+"</tbody></table></div>";
};

R.cards = function(s){
  return (s.intro?'<p class="lede">'+rich(s.intro)+"</p>":"")+'<div class="grid '+(s.cols||"g2")+'" data-catalog>'+
    s.items.map(function(t){
      var meta = (t.meta||[]).map(function(m){return "<div><dt>"+esc(m.k)+"</dt><dd>"+rich(m.v)+"</dd></div>";}).join("");
      var tag = t.href ? 'a class="tile lnk" href="'+esc(t.href)+'"' : 'div class="tile"';
      return "<"+tag+' id="'+(t.id||"")+'" data-search="'+esc(searchText(t.id,t.title,t.text,t.kicker))+'">'+
        (t.kicker?'<div class="k">'+esc(t.kicker)+"</div>":"")+
        "<h4>"+(t.id?'<span class="id">'+esc(t.id)+"</span> ":"")+esc(t.title)+"</h4>"+
        (t.text?"<p>"+rich(t.text)+"</p>":"")+
        (meta?'<dl class="metaGrid" style="margin-top:var(--space-2)">'+meta+"</dl>":"")+
        ((t.items||[]).length?'<ul class="ticks" style="margin-top:var(--space-2)">'+
          t.items.map(function(x){return "<li>"+rich(x)+"</li>";}).join("")+"</ul>":"")+
        (t.traces?traceChips(t.traces):"")+(t.href?"</a>":"</div>");}).join("")+"</div>";
};

R.flow = function(s){
  var h = s.intro?'<p class="lede">'+rich(s.intro)+"</p>":"";
  /* Paragraphs above the picture, same shape as R.prose: a section that has to
     argue something before it draws it needs more than one opening line. */
  h += (s.body||[]).map(function(p){return "<p>"+rich(p)+"</p>";}).join("");
  h += (s.flows||[]).map(function(f){
    return '<figure class="artfig"><div class="artwrap">'+artFlow(f, f.name||s.title)+"</div>"+
      artKey(f.steps)+"</figure>";
  }).join("");
  return h;
};

R.screen = function(s){
  var h = s.intro?'<p class="lede">'+rich(s.intro)+"</p>":"";
  h += (s.body||[]).map(function(p){return "<p>"+rich(p)+"</p>";}).join("");
  var sc = s.screen||{};
  h += '<figure class="artfig"><div class="artwrap">'+artScreen(sc, sc.name||s.title)+"</div>"+
    artKey(screenOrder(sc))+"</figure>";
  if(s.items) h += '<ul class="plain">'+s.items.map(function(i){
    return "<li>"+rich(i)+"</li>";}).join("")+"</ul>";
  return h;
};

R.code = function(s){
  return (s.intro?'<p class="lede">'+rich(s.intro)+"</p>":"")+(s.blocks||[]).map(function(b){
    return '<div class="codeblock">'+(b.title?'<div class="cap"><b>'+esc(b.title)+"</b>"+
      (b.note?'<span class="muted">'+rich(b.note)+"</span>":"")+"</div>":"")+
      '<pre class="code">'+esc(b.code)+"</pre></div>";}).join("");
};

/* What has changed about a requirement since it was frozen, BELOW the original
   and never in place of it (FR-AMD-04). The original is what every existing
   trace, test and decision was written against, so it is left exactly as it was
   and the amendment is added under a rule — a reader can see both what it said
   and what moved, and the identifier never has to be retired to say so. */
function amended(item){
  var found = item.amendments||[];
  if(!found.length) return "";
  return '<div class="amended"><b>Amended since</b><ul class="ticks">'+
    found.map(function(one){
      return '<li><span class="when mono tiny">'+esc(one.date)+"</span> "+
        rich(one.text)+"</li>";}).join("")+"</ul></div>";
}

// The priority band, once. It was spelled as a literal in the filter legend
// below, and the guard that keeps this vocabulary in one place scans only the
// toolchain package — so renaming the band there would have passed every test
// and silently desynchronised this renderer from it.
var BANDS = ["Must","Should","Could","Won't"];

        items.filter(function(r){return r.priority===p;}).length+"</button>";}).join("")+"</div>";

/* One folded set of execution instructions, on the card of the unit it belongs
   to (FR-EXE-15). Built from `.lane.do`, `pre.code` and `.btn.sm.copy`, which
   the playbook's steps already use, so this needed no new styling beyond making
   the summary look clickable — and `wireCopy` finds the <pre> through the
   button's own parent, so it needed no new script at all.

   Shut by default: 173 sets of instructions rendered open would be a plan
   nobody can find inside its own document. */
function promptFold(id, label, body){
  if(!body) return "";
  /* The copy button lives INSIDE the summary, so it is reachable while the
     fold is shut — taking a prompt without reading it is the common case, and
     an operator should not have to expand five thousand words to get at them.
     `wireCopy` therefore looks for the <pre> in the whole fold rather than in
     the button's own parent, which is the one thing that must move with it. */
  return '<details class="pf" id="'+esc(id)+'">'+
    '<summary><span class="car">&#9656;</span><span class="pft">'+esc(label)+"</span>"+
    '<button class="btn sm copy" type="button">Copy prompt</button></summary>'+
    '<pre class="code">'+esc(body)+"</pre></details>";
}
/* The fold on a unit's own card. The element id is derived from the unit, never
   authored — and the unit's identifier is NOT the item's identifier, because an
   item carrying `id: "M1"` in a prompt list would declare M1 a second time in a
   set where the milestone's own page already declares it. */
function unitPrompt(id, label, body){ return promptFold("prompt-"+id, label, body); }

R.prompts = function(s){
  return (s.intro?'<p class="lede">'+rich(s.intro)+"</p>":"")+
    (s.items||[]).map(function(one){
      return promptFold(one.id, one.title, one.body);
    }).join("");
};
