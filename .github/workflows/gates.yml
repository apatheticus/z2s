name: gates

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install Playwright and Chromium
        run: |
          npm install --global playwright@1.59.1
          playwright install --with-deps chromium

      - name: Browser harness is live
        run: |
          python3 - <<'PY'
          import sys
          from tests import test_browser as t
          if t.AUDIT is None:
              sys.exit("browser harness did not launch Chromium: %s" % t.REASON)
          print("browser harness launched Chromium")
          PY

      - name: Test suite
        run: |
          set -o pipefail
          python3 -m unittest discover -s tests -v 2>&1 | tee suite.log

      - name: No test was skipped
        if: always()
        run: |
          if grep -qE '^(OK|FAILED).*skipped=' suite.log; then
            echo "::error::tests were skipped - a skip is never a pass (LD-04 / NFR-VAL-05)"
            grep -E '\.\.\. skipped' suite.log || true
            exit 1
          fi
          echo "no test reported a skip"

      - name: Regenerate the published set
        working-directory: docs/_build
        run: python3 generate.py

      - name: The committed set regenerates byte-identically
        run: |
          if [ -n "$(git status --porcelain -- docs/)" ]; then
            echo "::error::regeneration changed docs/ - the committed set is not byte-identical"
            git status --porcelain -- docs/
            git diff -- docs/ | head -200
            exit 1
          fi
          echo "docs/ regenerated byte-identically"

      - name: Rendered documents
        working-directory: docs/_build
        run: python3 check.py

      - name: Self-hosted set
        run: python3 -m selfhost.build --check

      - name: Plugin lock
        run: python3 -m z2s.pack --check

      - name: Pipeline
        run: python3 -m z2s.pipeline docs/*.html
